<script>

const SX=327,SY=652;
const D=(x,y,w,h,c,r=0,ex='')=>`<div style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${c};border-radius:${typeof r=='number'?r+'px':r};${ex}"></div>`;
const GL=(x,y,w,h,fill,fr,bw)=>D(x,y,w,h,fill,Math.round(h*.38),`border:${bw}px solid ${fr};box-sizing:border-box`)+D(x+w*2+14-w,y,w,h,fill,Math.round(h*.38),`border:${bw}px solid ${fr};box-sizing:border-box`)+D(x+w-2,y+h*.28,18,bw,fr,3)+D(x-14,y+h*.28,16,bw,fr,3)+D(x+w*2+12,y+h*.28,16,bw,fr,3);
const IMG1=D(0,0,166,116,'#EEF6F7')+D(18,92,130,10,'#D3E4E7',5)+GL(22,40,54,40,'rgba(150,210,230,.55)','#1F2F4A',5);
const IMG2=D(0,0,166,116,'#FFF4E6')+D(18,92,130,10,'#EAD9C2',5)+GL(22,40,54,40,'#2B2B44','#C27A2A',5);
function CUP(){return D(206,236,184,14,'#9CCBD3',7)+GL(212,148,80,62,'rgba(255,255,255,.55)','#1F2F4A',8)+D(232,160,18,8,'rgba(255,255,255,.9)',4)+D(318,160,18,8,'rgba(255,255,255,.9)',4)}
function SITE(){return `<div class="stt">18:00</div><div class="url">bebekoptika.az</div><div class="brand"><span class="logo"></span>Bəbək Optika</div><div class="menu"></div>
<div class="hero"><div class="ht">Yeni eynəklər<br>sifarişlə</div><div class="hs">Bakı · Evə çatdırılma</div><div class="tag">Yeni kolleksiya</div>${CUP()}</div>
<div class="card" id="cd0" style="left:16px"><div class="im">${IMG1}</div><div class="nm">Klassik</div><div class="pr">45 ₼</div></div>
<div class="card" style="left:220px"><div class="im">${IMG2}</div><div class="nm">Günəş</div><div class="pr">38 ₼</div></div>
<div class="chips"><div class="chp">Hamısı</div><div class="chp">Kişi</div><div class="chp">Qadın</div><div class="chp">Uşaq</div></div>
<div class="btn" id="BTN">Sifariş et</div>`}
$('site').innerHTML=SITE();
const SK=[[24,100,250,46],[16,166,394,270],[16,764,394,66],[16,464,190,230],[220,464,190,230],[16,706,394,44],[22,42,382,40]];
const ICO='<svg width="40" height="34" viewBox="0 0 40 34"><rect x="2" y="2" width="36" height="30" rx="6" fill="none" stroke="#A9A9C2" stroke-width="3"/><path d="M6 28 L16 16 L23 23 L28 18 L35 28" fill="none" stroke="#A9A9C2" stroke-width="3" stroke-linejoin="round"/><circle cx="28" cy="10" r="3" fill="#A9A9C2"/></svg>';
const LBL=['Logo',ICO+'Şəkil','Düymə',ICO+'45 ₼','Günəş','Kateqoriya','bebekoptika.az'];
const ORD=[0,6,1,3,4,5,2];
$('skel').innerHTML=SK.map(([x,y,w,h],k)=>`<i style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"></i>`).join('')+SK.map(([x,y,w,h],k)=>`<b style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">${LBL[k]}</b>`).join('');
const FT=k=>T.fill[ORD.indexOf(k)];
// ---------------- eye chart ----------------
const CX0=150,CX1=930,CY0=660,CY1=1530;
const RX=540,RY=[850,958,1052,1140],FN=['Logo','Şəkil','Qiymət','Düymə'],FS=[100,80,64,50],RW=250,RH=66;
const BT=[540,1404],LZ=[[388,1404],[692,1404]];
const FLYSK=[0,1,3,2],FLYT=()=>[T.fill[0],T.fill[2],T.fill[3],T.fill[6]];
const PILL=6.25,CD=[3.0,3.4,3.8],IGN=4.2;
function chipSvg(k,x,y,sc,o,on,w=130){const h=w>150?RH:48;return `<g opacity="${o}" transform="translate(${x} ${y}) scale(${sc})"><rect x="${-w/2}" y="${-h/2+8}" width="${w}" height="${h}" rx="16" fill="rgba(0,0,0,.45)"/><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="16" fill="${on?'#C8FF2E':'#1E1E2B'}" stroke="${on?'#07070C':'#3A3A4F'}" stroke-width="4"/>
  <text y="10" text-anchor="middle" style="font-family:'Inter Display'" font-weight="800" font-size="${w>150?30:25}" fill="${on?'#07070C':'#A9A9C2'}">${FN[k]}</text></g>`}
const clicks=t=>CD.filter(w=>t>=w).length+(t>=T.f4?1:0);
function levelSvg(t){let s=`<rect x="${CX0+8}" y="${CY0+16}" width="${CX1-CX0}" height="${CY1-CY0}" rx="60" fill="rgba(0,0,0,.45)"/>
  <rect x="${CX0}" y="${CY0}" width="${CX1-CX0}" height="${CY1-CY0}" rx="60" fill="#12121B" stroke="#3A3A4F" stroke-width="6"/>
  <clipPath id="lvc"><rect x="${CX0+3}" y="${CY0+3}" width="${CX1-CX0-6}" height="${CY1-CY0-6}" rx="57"/></clipPath><g clip-path="url(#lvc)">`;
  // blur filters per row
  const bl=k=>{if(k>=3)return 0;const w=CD[k];return lerp([7,9,10][k],0,eOC(P(t,w,.22)))};
  s+='<defs>'+[0,1,2,4].map(k=>`<filter id="bf${k}" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="${k==4?lerp(8,0,eOC(P(t,T.f4,.3))):bl(k)}"/></filter>`).join('')+'</defs>';
  // lightbox chart
  const pul=t>=T.f4&&t<T.f4+.4?Math.sin(Math.PI*P(t,T.f4,.4)):0;
  s+=`<g transform="translate(540 1005) scale(${1+.03*pul}) translate(-540 -1005)"><rect x="318" y="768" width="444" height="474" rx="26" fill="#2B2B3A"/><rect x="330" y="778" width="420" height="452" rx="20" fill="#F5F5FA"/>`;
  // scanning lime wave at the final press
  if(t>=T.f4-.25&&t<T.f4+.5){const q=eIO(P(t,T.f4-.25,.6));const y=lerp(770,1240,q);s+=`<rect x="330" y="${y-60}" width="420" height="60" fill="#C8FF2E" opacity="${.5*(1-q*.5)}"/><rect x="330" y="${y-6}" width="420" height="10" rx="5" fill="#C8FF2E"/>`}
  for(let k=0;k<3;k++){const sh=t>=CD[k];const j=sh?0:Math.sin(t*3+k)*4;
    s+=`<g filter="url(#bf${k})"><text x="${RX+j}" y="${RY[k]+FS[k]*.36}" text-anchor="middle" font-family="Inter Display" font-weight="800" font-size="${FS[k]}" fill="#07070C" letter-spacing="${sh?2:6}">${FN[k]}</text>${sh?'':`<text x="${RX-j+6}" y="${RY[k]+FS[k]*.36+3}" text-anchor="middle" font-family="Inter Display" font-weight="800" font-size="${FS[k]}" fill="#07070C" opacity=".35" letter-spacing="6">${FN[k]}</text>`}</g>`;
    if(sh){const q=eOB(P(t,CD[k],.3));s+=`<g transform="translate(712 ${RY[k]}) scale(${q})"><circle r="20" fill="#C8FF2E" stroke="#07070C" stroke-width="3"/><path d="M-9 0 L-2 7 L10 -7" fill="none" stroke="#07070C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>`}}
  // missing row
  const jam=t>=T.jam&&t<T.st[2];{const o=jam?(Math.floor(t*6)%2?1:.45):.7;if(t<T.st[2]+.1)s+=`<rect x="${RX-RW/2}" y="${RY[3]-RH/2}" width="${RW}" height="${RH}" rx="16" fill="#E4E4EE" stroke="${jam?'#FF4D5E':'#A9A9C2'}" stroke-width="4" stroke-dasharray="12 9" opacity="${o}"/><text x="${RX}" y="${RY[3]+13}" text-anchor="middle" font-family="Inter Display" font-weight="800" font-size="38" fill="${jam?'#FF4D5E':'#A9A9C2'}" opacity="${o}">?</text>`}
  if(t<T.st[2]+.02){for(let i=0;i<3;i++){const w=T.st[i];if(t<w-.3)continue;const q=eIC(P(t,w-.3,.3));const y=lerp(RY[3]-520,RY[3],q);s+=`<rect x="${RX-RW/2+i*(RW/3)+2}" y="${y-RH/2}" width="${RW/3-4}" height="${RH}" rx="12" fill="#C8FF2E" stroke="#07070C" stroke-width="4"/>`}}
  else s+=chipSvg(3,RX,RY[3],1,1,true,RW);
  s+=`<g filter="url(#bf4)"><text x="${RX}" y="1208" text-anchor="middle" font-family="DejaVu Sans Mono" font-weight="700" font-size="24" fill="#5A5A70">bebekoptika.az</text></g></g>`;
  // phoropter: two lenses + knob
  const nc=clicks(t);
  s+=`<rect x="300" y="1392" width="480" height="24" rx="12" fill="#2B2B3A"/>`;
  LZ.forEach(([x,y],i)=>{const rot=nc*45+(t>=IGN&&t<T.st[2]?Math.sin(t*50)*6:0);const ok=t>=T.f4;
    s+=`<circle cx="${x}" cy="${y}" r="82" fill="#1E1E2B" stroke="${ok?'#C8FF2E':'#3A3A4F'}" stroke-width="7"/><g transform="rotate(${rot*(i?1:-1)} ${x} ${y})">${[...Array(12)].map((_,k)=>`<line x1="${x}" y1="${y-74}" x2="${x}" y2="${y-62}" stroke="#A9A9C2" stroke-width="4" transform="rotate(${k*30} ${x} ${y})"/>`).join('')}</g>
    <circle cx="${x}" cy="${y}" r="52" fill="${ok?'rgba(200,255,46,.28)':'rgba(123,97,255,.3)'}" stroke="#07070C" stroke-width="4"/><path d="M${x-26} ${y-18} Q${x-14} ${y-34} ${x+4} ${y-36}" fill="none" stroke="#F5F5FA" stroke-width="6" stroke-linecap="round" opacity=".7"/>`});
  const pr=[3.0,3.4,3.8,5.7,...T.st].some(w=>t>=w&&t<w+.2)?12:0;const lit=t>=T.st[2];
  s+=`<rect x="${BT[0]-60}" y="${BT[1]+10}" width="120" height="56" rx="16" fill="#1E1E2B" stroke="#3A3A4F" stroke-width="4"/>
  <ellipse cx="${BT[0]}" cy="${BT[1]+14+pr}" rx="46" ry="16" fill="${lit?'#8FB81F':'#5A48C8'}"/><ellipse cx="${BT[0]}" cy="${BT[1]+pr}" rx="46" ry="18" fill="${lit?'#C8FF2E':'#7B61FF'}" stroke="#07070C" stroke-width="4"/>`;
  // readout
  const bad=t>=IGN&&t<T.st[2];const blink=bad&&Math.floor(t*6)%2==0;const pc=Math.min(3,CD.filter(w=>t>=w).length)*25;let txt='AYDINLIQ: '+pc+'%',col=pc?'#F5F5FA':'#A9A9C2',bc='#2B2B3A';
  if(bad){txt='XƏTA: DÜYMƏ YOX';col=blink?'#FF4D5E':'#7A2A33';bc='#FF4D5E'}
  if(t>=T.st[2]){txt='AYDINLIQ: 75%';col='#C8FF2E';bc='#C8FF2E'}
  if(t>=T.f4){txt='AYDINLIQ: 100% ✓'}
  s+=`<rect x="310" y="${CY0+24}" width="460" height="58" rx="16" fill="#07070C" stroke="${bc}" stroke-width="3"/>
  <text x="540" y="${CY0+64}" text-anchor="middle" font-family="DejaVu Sans Mono" font-weight="700" font-size="28" fill="${col}">${txt}</text>`;
  return s+'</g>'}
// ---------------- mascot ----------------
const STB=[BT[0]-45,BT[1]-134];
const REST=[935,1300],CHM=[SX+16+95,SY+464+90],BTP=[540,SY+797];
