<script>

const T=window.T;const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));const P=(t,t0,d)=>clamp((t-t0)/d);
const eOC=x=>1-Math.pow(1-x,3),eOQ=x=>1-Math.pow(1-x,5),eIC=x=>x*x*x,eIQ=x=>x*x,eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eOB=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};const lerp=(a,b,p)=>a+(b-a)*p;
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function pop(el,t,t0,o={}){const d=o.d??0.5,y=o.y??40,x=o.x??0,s0=o.s??0.86,b=o.b??0;
  if(t<t0){el.style.opacity=0;return 0}const p=P(t,t0,d),e=eOB(p),oc=eOC(p);
  el.style.opacity=eOC(clamp(p*2.4));el.style.transform=`translate(${(1-oc)*x}px,${(1-oc)*y}px) scale(${s0+(1-s0)*e})`;
  el.style.filter=b?`blur(${(1-eOC(clamp(p*2.2)))*b}px)`:'';return p}
function show(id,t,a,b){const el=$(id);const on=t>=a&&t<=b;el.style.display=on?'block':'none';return on}
function hline(el,t,t0,tout,d=.5){if(t<t0){el.style.opacity=0;return}const p=P(t,t0,d);let sc=lerp(1.5,1,eOQ(p)),op=eOC(clamp(p*2.5)),bl=(1-eOC(p))*18,y=0;
  if(tout!==undefined&&t>tout){const q=eIO(P(t,tout,.35));y=-q*80;op*=1-q;bl+=q*10}
  el.style.opacity=op;el.style.transformOrigin='0 50%';el.style.transform=`translateY(${y}px) scale(${sc})`;el.style.filter=`blur(${bl}px)`}
function lines(cx,cy,n,R,len,bp,col,w){let h='';for(let i=0;i<n;i++){const a=i/n*Math.PI*2+.3,r1=R+150*eOC(bp),r2=r1+len*(1-bp);
  h+=`<line x1="${cx+Math.cos(a)*r1}" y1="${cy+Math.sin(a)*r1}" x2="${cx+Math.cos(a)*r2}" y2="${cy+Math.sin(a)*r2}" stroke="${col}" stroke-width="${w}" opacity="${1-bp}"/>`}return h}


const SX=327,SY=632;
// deterministic rng
let seed=7;const rn=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
// dirt bands (screen y ranges)
const BY=[[0,158],[158,450],[450,742],[742,856]];
$('bands').innerHTML=BY.map((b,i)=>{let s='';for(let k=0;k<5;k++){const w=60+rn()*140;s+=`<div class="sm" style="left:${rn()*380-30}px;top:${rn()*(b[1]-b[0])-30}px;width:${w}px;height:${w*.7}px"></div>`}
  if(i==0)s+=`<svg style="position:absolute;right:0;top:0" width="150" height="150" viewBox="0 0 150 150" fill="none" stroke="rgba(235,230,220,.8)" stroke-width="1.6"><path d="M150 0 L40 110 M150 0 L80 140 M150 0 L10 60 M150 0 L120 150 M150 0 L0 20"/>`+[30,60,95,130].map(r=>`<path d="M${150-r*.95} ${r*.2} Q${150-r*.7} ${r*.6} ${150-r*.75} ${r*.75} Q${150-r*.55} ${r*.8} ${150-r*.35} ${r*.95} Q${150-r*.15} ${r*.95} ${150-r*.05} ${r}"/>`).join('')+`</svg>`;
  return `<div class="band" id="bd${i}" style="top:${b[0]}px;height:${b[1]-b[0]}px">${s}</div>`}).join('');
// dust particles (screen coords)
const DP=[];for(let i=0;i<620;i++)DP.push({x:rn()*426,y:rn()*856,r:1+rn()*3.2,d:rn()*.5,vy:(rn()-.5)*260,sp:.7+rn()*.7,c:rn()});
function BOTTLE(){return `<div style="position:absolute;left:255px;top:60px;width:120px;height:200px">
<i style="left:30px;top:0;width:56px;height:34px;border-radius:10px 16px 4px 4px;background:#fff"></i><i style="left:84px;top:8px;width:30px;height:14px;border-radius:4px;background:#fff"></i>
<i style="left:40px;top:30px;width:36px;height:28px;background:#E9F6F8"></i><i style="left:18px;top:56px;width:80px;height:140px;border-radius:24px 24px 18px 18px;background:#1F8A9C"></i>
<i style="left:30px;top:96px;width:56px;height:46px;border-radius:10px;background:#fff;opacity:.9"></i><i style="left:42px;top:108px;width:32px;height:8px;border-radius:4px;background:#7CC9D8"></i><i style="left:42px;top:122px;width:22px;height:8px;border-radius:4px;background:#7CC9D8"></i></div>
<i style="left:228px;top:40px;width:22px;height:22px;border-radius:11px;border:3px solid #fff;box-sizing:border-box"></i><i style="left:200px;top:82px;width:14px;height:14px;border-radius:7px;border:3px solid #fff;box-sizing:border-box"></i><i style="left:214px;top:10px;width:12px;height:12px;border-radius:6px;background:#fff;opacity:.8"></i>`}
function MOP(){return `<i style="left:78px;top:6px;width:8px;height:78px;border-radius:4px;background:#8A6A4A;transform:rotate(18deg)"></i><i style="left:42px;top:78px;width:64px;height:24px;border-radius:8px;background:#1F8A9C"></i>`}
function WIN(){return `<i style="left:46px;top:12px;width:74px;height:90px;border-radius:8px;border:5px solid #1F8A9C;box-sizing:border-box;background:#BFE6EE"></i><i style="left:81px;top:12px;width:5px;height:90px;background:#1F8A9C"></i><i style="left:46px;top:55px;width:74px;height:5px;background:#1F8A9C"></i>`}
$('site').innerHTML=`<div class="stt">18:00</div><div class="url">parilti.az</div><div class="brand"><span class="logo">✦</span>Parıltı Təmizlik</div><div class="bur"></div>
<div class="hero"><div class="ht">Evin<br>parıldasın.</div><div class="hs">Ev · ofis · pəncərə</div><div class="tag">45 ₼-dan</div>${BOTTLE()}</div>
<div id="stain"><b style="left:0;top:10px;width:110px;height:100px"></b><b style="left:60px;top:0;width:100px;height:90px"></b><b style="left:50px;top:50px;width:90px;height:80px"></b></div>
<div class="card" style="left:16px"><div class="im">${MOP()}</div><div class="nm">Ev təmizliyi</div><div class="pr">45 ₼</div></div>
<div class="card" style="left:220px"><div class="im">${WIN()}</div><div class="nm">Pəncərə</div><div class="pr">25 ₼</div></div>
<div class="chips"><div class="chp" id="ch0">10:00</div><div class="chp">12:00</div><div class="chp">15:00</div></div>
<div class="btn" id="BTN">Sifariş et</div>`;

// ---------------- mascot ----------------
const HOME=[930,580],REST=[950,1380],BLOW=[150,1020],STN=[SX+290,SY+355],CHP=[SX+77,SY+728],BTP=[540,SY+797];
const bandMid=i=>SY+(BY[i][0]+BY[i][1])/2;
const K=[[T.curIn,1.65,540,1980,HOME[0],HOME[1],420,1,.9]];
K.push([T.blow0-.45,T.blow0-.05,...HOME,...BLOW,300,.9,.9]);
let prev=BLOW;T.wipe.forEach((w,i)=>{const s=[SX-6,bandMid(i)];K.push([w-.4,w-.02,...prev,...s,i==0?240:110,.9,.9]);prev=[SX+426,bandMid(i)]});
K.push([T.wipe[3]+T.wd+.05,T.wipe[3]+T.wd+.45,...prev,...REST,240,.9,.9]);
K.push([T.ex-.45,T.ex-.05,...REST,STN[0]+60,STN[1]+40,260,.9,.9]);
K.push([T.scrub0-.3,T.scrub0,STN[0]+60,STN[1]+40,...STN,80,.9,.9]);
K.push([T.clean+.35,T.clean+.75,...STN,...REST,240,.9,.9]);
K.push([T.chip-.42,T.chip-.04,...REST,...CHP,240,.9,.9]);
K.push([T.btn-.42,T.btn-.04,...CHP,BTP[0]+8,BTP[1]+6,160,.9,.9]);
K.push([T.toast+.4,T.toast+.8,BTP[0]+8,BTP[1]+6,...REST,240,.9,.9]);
K.push([T.outro0,T.outro0+.4,...REST,-200,900,260,.9,.9]);
const TAPS=[T.chip,T.btn];
function curState(t){let x=1200,y=1600,rot=0,sx=1,sy=1,vis=t>=T.curIn&&t<T.outro0+.42,sc=.9,eye=1,lx=0;
  let last=null;for(const k of K){if(t>=k[0])last=k}
  if(last){const [t0,t1,x0,y0,x1,y1,h,s0,s1]=last;const p=P(t,t0,t1-t0);const e=eIO(p);x=lerp(x0,x1,e);y=lerp(y0,y1,e)-Math.sin(Math.PI*p)*Math.abs(h);sc=lerp(s0,s1,e);
    if(p<1){sy=1+.18*Math.sin(Math.PI*p);sx=1/sy;rot=Math.sin(Math.PI*p)*(x1>x0?14:x1<x0?-14:0)}
    else{const lp=t-t1;if(lp<.18){const k2=Math.sin(Math.PI*lp/.18);sy=1-.25*k2;sx=1+.2*k2}}}
  let moving=false;for(const k of K){if(t>=k[0]-.02&&t<k[1]+.2)moving=true}
  // blowing: inflate then push forward at each puff
  T.puff.forEach(c=>{if(t>=c-.25&&t<c){const q=P(t,c-.25,.25);sx*=1+.2*q;sy*=1+.2*q;rot=-20*q;moving=true}
    else if(t>=c&&t<c+.35){const q=P(t,c,.35);const k2=Math.sin(Math.PI*q);sx*=1-.18*k2;sy*=1+.1*k2;x+=30*k2;rot=-20*(1-q);moving=true}});
  if(t>=T.blow0&&t<T.blow1&&!moving){rot=Math.sin(t*4)*5;moving=true}
  // wiping: ride the squeegee across the band
  T.wipe.forEach((w,i)=>{if(t>=w&&t<w+T.wd){const p=eIO(P(t,w,T.wd));x=SX-6+p*432;y=bandMid(i)+Math.sin(t*40)*3;rot=-8;moving=true}});
  // scrubbing
  if(t>=T.scrub0&&t<T.clean){x=STN[0]+Math.sin((t-T.scrub0)*26)*42;y=STN[1]+Math.cos((t-T.scrub0)*13)*16;rot=Math.sin((t-T.scrub0)*26)*14;moving=true}
  for(const c of [...TAPS,...T.hits]){if(t>=c&&t<c+.25){const q=Math.sin(Math.PI*P(t,c,.25));sy*=1-.28*q;sx*=1+.16*q;moving=true}}
  if(t>=T.ex&&t<T.ex+.35)eye=1.35;
  if(t>=T.clean&&t<T.clean+.3)eye=1.25;
  if(!moving&&vis){y+=Math.sin(t*6)*5;rot=Math.sin(t*2.6)*7}
  return{x,y,rot,sx:sx*sc,sy:sy*sc,vis,eye,lx}}

const gctx=$('grain').getContext('2d');const gimg=gctx.createImageData(540,960);
function grain(fr){const r=rnd(fr*7919+13);const d=gimg.data;for(let i=0;i<d.length;i+=4){const v=r()*255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255}gctx.putImageData(gimg,0,0)}

const SH2=[[T.hookA+.05,8],...T.puff.map(c=>[c,5]),...T.hits.map(c=>[c,6]),[T.clean,10],[T.wave1,9],[T.chip,4],[T.btn,7],[T.drop,22],[T.t6b,14],[T.tile,10],[T.click2,10]];
const H=['x0','x1','x2','x3','x4'];
const dctx=$('dust').getContext('2d');
function star(x,y,r,a){const q=r*.28;let d=`M${x} ${y-r}`;for(let k=0;k<4;k++){const a1=(k+.5)*Math.PI/2,a2=(k+1)*Math.PI/2;d+=` Q${x} ${y} ${x+Math.sin(a2)*r} ${y-Math.cos(a2)*r}`}
  return `<path d="${d}" fill="#C8FF2E" stroke="none" transform="rotate(${a} ${x} ${y})"/>`}
const GL=[[SX+70,SY+130],[SX+360,SY+220],[SX+120,SY+520],[SX+330,SY+640],[SX+210,SY+820]];

function render(t){
  $('dots').style.transform=`translate(${-t*12}px,${-t*20}px)`;
  $('g1').style.transform=`translate(${Math.sin(t*.5)*70}px,${Math.cos(t*.4)*60}px)`;$('g2').style.transform=`translate(${Math.cos(t*.45)*70}px,${Math.sin(t*.35)*70}px)`;
  let sx=0,sy=0;for(const [t0,a] of SH2){const d=t-t0;if(d>0&&d<.35){const k=Math.pow(1-d/.35,2);sx+=Math.sin(d*97)*a*k;sy+=Math.cos(d*83)*a*.6*k}}
  $('world').style.transform=`translate(${sx}px,${sy}px)`;grain(Math.round(t*60));
  let fl=0;for(const [t0,a] of [[T.drop,.38],[T.t6b,.2],[T.clean,.12],[T.wave1,.1]]){const d=t-t0;if(d>=0&&d<.35)fl=Math.max(fl,a*(1-d/.35))}$('flashL').style.opacity=fl;

  if(show('sMain',t,0,18.1)){
    hline($('h0a'),t,T.hookA,T.hookOut,.22);hline($('h0b'),t,T.hookB,T.hookOut,.22);
    H.forEach((id,i)=>{hline($(id+'a'),t,T.hA[i],T.hOut[i],.4);hline($(id+'b'),t,T.hA[i]+.15,T.hOut[i],.4)});
    const sb=$('sub0');if(t<T.sub||t>2.7)sb.style.opacity=0;else{const p=eOC(P(t,T.sub,.4)),q=eIO(P(t,2.4,.3));sb.style.opacity=p*(1-q);sb.style.transform=`translateY(${(1-p)*24-q*40}px)`}
    const fo=eIC(P(t,T.outro0,.45));let rs=1;
    for(const [c,a] of [[T.clean,.02],[T.wave1,.035]]){const q=P(t,c,.35);if(q>0&&q<1)rs+=a*Math.sin(Math.PI*q)}
    const pi=eOC(P(t,T.phone,.5));const tl=$('tilt');tl.style.opacity=Math.min(pi*2,1)*(1-fo);
    const ty=(1-pi)*500+fo*80,ps=rs*(1-.12*fo)*(.85+.15*pi);
    tl.style.transform=`translateY(${ty}px) scale(${ps})`;
    // haze + dust
    const bp=P(t,T.blow0,T.blow1-T.blow0);
    $('haze').style.opacity=1-eIO(clamp(bp*1.3));
    dctx.clearRect(0,0,1080,1920);
    if(bp<1){const cx=540,cy=1060;
      for(const d of DP){const q=clamp((bp-d.d*.6-d.x/426*.25)/.5);if(q>=1)continue;const e=eIQ(q);
        const px=SX+d.x+e*900*d.sp,py=SY+d.y+e*d.vy+Math.sin(q*9+d.c*6)*14*q;
        const X=cx+(px-cx)*ps,Y=cy+(py-cy)*ps+ty;
        dctx.globalAlpha=(1-q)*(.55+.4*d.c)*Math.min(pi*2,1);dctx.fillStyle=d.c>.5?'#D8D0C0':'#8E8472';dctx.beginPath();dctx.arc(X,Y,d.r*(1+q),0,6.283);dctx.fill()}
      dctx.globalAlpha=1}
    // wipes
    T.wipe.forEach((w,i)=>{const p=eIO(P(t,w,T.wd));$('bd'+i).style.clipPath=`inset(0 0 0 ${p*100}%)`});
    // stain
    let so=1,ssc=1;T.hits.forEach((h,j)=>{const q=eOC(P(t,h,.25));so-=q*(j<2?.3:.4);ssc-=q*.12});
    const st=$('stain');st.style.opacity=Math.max(0,so);st.style.transform=`scale(${ssc})`;
    // lime wave shine + glint
    const wv=eIO(P(t,T.wave0,T.wave1-T.wave0)),wx=lerp(-160,1240,wv);
    const wa=t>=T.wave0&&t<T.wave1+.2;$('wvb').style.opacity=wa?1-P(t,T.wave1,.2):0;$('wvl').style.opacity=wa?1-P(t,T.wave1,.2):0;
    $('wvb').style.transform=`translateX(${wx-170}px)`;$('wvl').style.transform=`translateX(${wx-6}px)`;
    const gl=$('glint');gl.style.opacity=wa?.9*(1-P(t,T.wave1,.2)):0;gl.style.transform=`translate(${wx-SX-120}px,-120px) rotate(16deg)`;
    $('site').style.filter=`saturate(${t<T.wave0?.75:lerp(.75,1.08,clamp((wx-SX)/426))})`;
    const ch=$('ch0');{const on=t>=T.chip;ch.style.background=on?'#1F8A9C':'#fff';ch.style.color=on?'#fff':'#2E6A76';ch.style.borderColor=on?'#1F8A9C':'#CFE2E7';
      const q=t>=T.chip&&t<T.chip+.25?Math.sin(Math.PI*P(t,T.chip,.25)):0;ch.style.transform=`scale(${1-.08*q})`}
    const bt=$('BTN');{const on=t>=T.btn;bt.style.background=on?'#1F8A9C':'#0E3A44';bt.textContent=on?'Sifariş edildi ✓':'Sifariş et';
      const q=t>=T.btn&&t<T.btn+.25?Math.sin(Math.PI*P(t,T.btn,.25)):0;bt.style.transform=`scale(${1-.06*q})`}
    const ts=$('toast');pop(ts,t,T.toast,{d:.45,y:30,s:.7});if(t>T.outro0-.1)ts.style.opacity=(+ts.style.opacity)*(1-P(t,T.outro0-.1,.3));
    T.lab.forEach((c,i)=>{const e=$('lab'+i);pop(e,t,c,{d:.45,x:i==1?60:-60,y:0,s:.7});if(t>T.outro0-.1)e.style.opacity=(+e.style.opacity)*(1-P(t,T.outro0-.1,.3))});
    const c=curState(t);
    const bx=$('bx');if(t>=T.ex&&t<T.scrub0+.1){pop(bx,t,T.ex,{d:.35,y:30,s:.5});bx.style.left=(c.x-20)+'px';bx.style.top=(c.y-170)+'px';if(t>T.scrub0-.15)bx.style.opacity=(+bx.style.opacity)*(1-P(t,T.scrub0-.15,.25))}else bx.style.opacity=0;
    let fx='';
    // wind lines
    T.puff.forEach(p0=>{if(t>=p0&&t<p0+.6){const q=P(t,p0,.6);for(let k=0;k<4;k++){const y0=BLOW[1]-60+k*45,x0=BLOW[0]+120+q*360,ln=170*(1-q*.4);
      fx+=`<path d="M${x0} ${y0} q${ln*.5} ${-20+k*8} ${ln} 0" stroke="#F5F5FA" stroke-width="7" fill="none" opacity="${(1-q)*.9}"/>`}}});
    // squeegee blade + drops
    T.wipe.forEach((w,i)=>{if(t>=w-.05&&t<w+T.wd+.12){const p=eIO(P(t,w,T.wd));const bx2=SX+p*426,y0=SY+BY[i][0]+8,y1=SY+BY[i][1]-8;const o=t>w+T.wd?1-P(t,w+T.wd,.12):1;
      fx+=`<line x1="${bx2}" y1="${y0}" x2="${bx2}" y2="${y1}" stroke="#C8FF2E" stroke-width="14" opacity="${o}"/><line x1="${bx2+4}" y1="${y0+6}" x2="${bx2+4}" y2="${y1-6}" stroke="#F5FFD8" stroke-width="3" opacity="${o}"/>`;
      for(let k=0;k<6;k++){const dy=y0+(y1-y0)*((k*.37+i*.2)%1),dx=bx2-30-((k*53)%90)*p;fx+=`<circle cx="${dx}" cy="${dy+((t*300+k*40)%40)}" r="${5+k%3*2}" fill="#BFE6EE" opacity="${.85*o}"/>`}}
      const e=w+T.wd;if(t>=e&&t<e+.45)fx+=lines(SX+426,bandMid(i),6,14,20,P(t,e,.45),'#C8FF2E',4)});
    // scrub bubbles
    if(t>=T.scrub0&&t<T.clean+.6){for(let k=0;k<12;k++){const b0=T.scrub0+k*.15;if(t<b0)continue;const q=P(t,b0,.9);if(q>=1)continue;
      const bxx=STN[0]-70+((k*61)%150),byy=STN[1]+30-((k*37)%60)-q*90;fx+=`<circle cx="${bxx}" cy="${byy}" r="${8+(k%4)*5+q*6}" fill="rgba(255,255,255,.15)" stroke="#fff" stroke-width="3" opacity="${1-q}"/>`}}
    T.hits.forEach(h=>{if(t>=h&&t<h+.4)fx+=lines(STN[0],STN[1]+20,6,40,22,P(t,h,.4),'#F5F5FA',4)});
    if(t>=T.clean&&t<T.clean+.6)fx+=lines(STN[0],STN[1]+20,12,60,40,P(t,T.clean,.6),'#C8FF2E',6);
    if(t>=T.wave1&&t<T.wave1+.6)fx+=lines(540,1060,12,260,50,P(t,T.wave1,.6),'#C8FF2E',6);
    T.glint.forEach((g,k)=>{if(t>=g&&t<g+.7){const q=P(t,g,.7);const r=46*Math.sin(Math.PI*q);fx+=star(GL[k][0],GL[k][1]+ty,r,q*90)}});
    if(t>=T.chip&&t<T.chip+.5)fx+=lines(CHP[0],CHP[1],8,26,24,P(t,T.chip,.5),'#C8FF2E',5);
    if(t>=T.btn&&t<T.btn+.5)fx+=lines(BTP[0],BTP[1],8,40,30,P(t,T.btn,.5),'#C8FF2E',5);
    $('fxg').innerHTML=fx;
    const cc=$('cc');cc.style.opacity=c.vis?1:0;
    cc.style.transform=`translate(${c.x-10}px,${c.y-10}px) rotate(${c.rot}deg) scale(${c.sx},${c.sy})`;
    const bl=(t%2.7)<.12;const ey=bl?.15:Math.min(c.eye,1);
    $('eyes').setAttribute('transform',`translate(${c.lx} ${15.5*(1-ey)}) scale(${c.eye>1?c.eye:1} ${ey*(c.eye>1?c.eye:1)})`);
  }

  if(show('s6',t,T.drop-.05,20.05)){const slam=(e,t0,s0)=>{if(t<t0){e.style.opacity=0;return}const p=P(t,t0,.38);
      e.style.opacity=eOC(clamp(p*2.5));e.style.transform=`scale(${lerp(s0,1,eOQ(p))})`;e.style.filter=`blur(${(1-eOC(p))*22}px)`};
    slam($('l6a'),T.drop,1.7);slam($('l6b'),T.t6b,1.9);
    const ls=$('l6s');ls.style.opacity=t>=T.sweep?1:0;ls.style.backgroundPosition=`${lerp(140,-40,eIO(P(t,T.sweep,.75)))}% 0`;
    $('ul6').style.transform=`scaleX(${eOC(P(t,T.sweep+.1,.5))})`;
    const s6=$('s6'),xo=eIO(P(t,T.s6_out,.35));s6.style.opacity=1-xo;s6.style.transform=`scale(${1-.12*xo})`;s6.style.filter=xo>0?`blur(${xo*14}px)`:'';
    $('l6b').style.textShadow=`0 0 ${40*Math.max(0,1-P(t,T.t6b,.6))+12}px rgba(200,255,46,.45)`}

  if(show('s7',t,T.streak2-.02,24)){const s7=$('s7');s7.style.transformOrigin='540px 900px';s7.style.transform=`scale(${1+.035*eOC(P(t,T.tile,4))})`;
    const tw=$('tile7');if(t<T.tile)tw.style.opacity=0;else{const p=P(t,T.tile,.6);let sc=.4+.6*eOB(p);const cp=P(t,T.click2,.35);if(cp>0&&cp<1)sc*=1+.07*Math.sin(cp*Math.PI);
      tw.style.opacity=eOC(clamp(p*2.5));tw.style.transform=`scale(${sc}) rotate(${(1-eOC(p))*-14}deg)`}
    $('wave7').style.strokeDashoffset=1-eOC(P(t,T.wave2_0,T.wave2_1-T.wave2_0));
    const cg=$('cur7');if(t<T.cur0)cg.setAttribute('opacity',0);else{const p=eOC(P(t,T.cur0,T.cur1-T.cur0));const dx=(1-p)*-60,dy=(1-p)*90-Math.sin(p*Math.PI)*30;let sc=1;const cp=P(t,T.click2,.2);if(cp>0&&cp<1)sc=1-.14*Math.sin(cp*Math.PI);
      cg.setAttribute('opacity',eOC(clamp((t-T.cur0)/.15)));cg.setAttribute('transform',`translate(${dx} ${dy}) translate(22 11) rotate(${(1-p)*-200}) scale(${sc}) translate(-22 -11)`)}
    const bl=(t%2.7)<.12;$('eyes7').setAttribute('transform',bl?'translate(0 22) scale(1 .12)':'');
    const tipX=390+22*300/64,tipY=520+11*300/64;const bp=P(t,T.click2,.7),ring=$('ring7');
    $('spk7').innerHTML=(t>=T.click2&&bp<1)?lines(tipX,tipY,10,60,70,bp,'#C8FF2E',7):'';
    if(t<T.click2||bp>=1)ring.setAttribute('opacity',0);else{ring.setAttribute('cx',tipX);ring.setAttribute('cy',tipY);ring.setAttribute('r',30+190*eOC(bp));ring.setAttribute('opacity',(1-bp)*.9)}
    [...$('wm7').children].forEach((e,i)=>pop(e,t,T.wm+i*.06,{y:60,s:.7,d:.5,b:8}));
    pop($('cta1'),t,T.cta1,{y:40,d:.55,b:8});pop($('cta2'),t,T.cta2,{y:50,s:.8,d:.6,b:8});pop($('pill'),t,T.pill,{y:50,s:.7,d:.6});
    let shp=P(t,T.pill+.45,.7);if(t>T.pill+1.6)shp=P(t,T.pill+1.6,.7);$('shine').style.transform=`skewX(-20deg) translateX(${lerp(0,900,eIO(shp))}px)`}

}
window.render=render;render(0);
window.measure=()=>[...document.querySelectorAll('.ln,#l6b,#l6a,#toast,.lab')].map(e=>[e.id||e.textContent.slice(0,14),Math.round(e.getBoundingClientRect().width),Math.round(e.getBoundingClientRect().left)]);
</script>
</body>
