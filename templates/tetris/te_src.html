<script>
{{HELPERS}}
const SX=327,SY=652;
const TOOTH=(x,y,s,c)=>`<svg style="position:absolute;left:${x}px;top:${y}px" width="${100*s}" height="${120*s}" viewBox="-50 -60 100 120"><path d="M-40 -38 Q-40 -60 -20 -57 Q0 -50 20 -57 Q40 -60 40 -38 Q42 -10 30 10 Q22 50 12 55 Q4 56 2 30 Q0 16 -2 30 Q-4 56 -12 55 Q-22 50 -30 10 Q-42 -10 -40 -38 Z" fill="${c}" stroke="rgba(16,48,46,.25)" stroke-width="3"/><path d="M-26 -36 Q-24 -46 -14 -46" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="6" stroke-linecap="round"/></svg>`;
function SITE(){return `<div class="stt">18:00</div><div class="url">gulusdental.az</div><div class="brand"><span class="logo">${TOOTH(7,5,.28,'#fff')}</span>Gülüş Dental</div><div class="menu"></div>
<div class="hero"><div class="ht">Sağlam<br>gülüş</div><div class="hs">Diş klinikası · Bakı</div><div class="tag">Müayinə 20 ₼</div>
<div style="position:absolute;left:236px;top:40px;width:150px;height:150px;border-radius:75px;background:rgba(255,255,255,.55)"></div>${TOOTH(250,46,1.2,'#fff')}
<svg style="position:absolute;left:330px;top:30px" width="40" height="40" viewBox="-20 -20 40 40"><path d="M0 -18 Q0 0 18 0 Q0 0 0 18 Q0 0 -18 0 Q0 0 0 -18Z" fill="#12857F"/></svg></div>
<div class="card" style="left:16px"><div class="im">${TOOTH(48,8,.85,'#fff')}<svg style="position:absolute;left:104px;top:18px" width="44" height="44" viewBox="0 0 44 44"><path d="M6 38 L34 10" stroke="#12857F" stroke-width="7" stroke-linecap="round"/><rect x="28" y="2" width="14" height="10" rx="3" fill="#12857F" transform="rotate(-45 35 7)"/></svg></div><div class="nm">Təmizlik</div><div class="pr">40 ₼</div></div>
<div class="card" style="left:220px"><div class="im" style="background:#FFF6DA">${TOOTH(48,8,.85,'#fff')}<svg style="position:absolute;left:112px;top:14px" width="40" height="40" viewBox="-20 -20 40 40"><path d="M0 -18 Q0 0 18 0 Q0 0 0 18 Q0 0 -18 0 Q0 0 0 -18Z" fill="#E8B400"/></svg></div><div class="nm">Ağartma</div><div class="pr">120 ₼</div></div>
<div class="chips"><div class="chp">10:00</div><div class="chp" id="chM">11:00</div><div class="chp">12:00</div><div class="chp">14:00</div></div>
<div class="btn" id="BTN">Növbə al</div>`}
$('site').innerHTML=SITE();
// pieces in fall order (bottom-up): btn, chips, card1, card2 (crooked), hero, brand, url
const SK=[[16,764,394,66],[16,706,394,44],[16,464,190,230],[220,464,190,230],[16,166,394,270],[24,100,230,46],[22,42,382,40]];
const PC=['#7B61FF','#5D8BFF','#9A6BFF','#FF8A3D','#6D5CF0','#B07BFF','#4F9DFF'];
$('skel').innerHTML=SK.map(([x,y,w,h],k)=>`<i style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"></i>`).join('')+SK.map(([x,y,w,h],k)=>`<b style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background-color:${PC[k]}"></b>`).join('');
const LAND=.38;
function pieceT(k,t){const [x,y,w,h]=SK[k];const f=T.fall[k];
  if(k===3){ // crooked card: falls sideways, gets stuck, rotate key, hard drop
    const stuckDy=(464-95)-(464+115);let dy,r=90,sh=0;
    if(t<T.stuck){const e=eIC(P(t,f,T.stuck-f));dy=lerp(stuckDy-700,stuckDy,e)}
    else if(t<T.hard){dy=stuckDy;sh=t<T.stuck+.6?Math.sin((t-T.stuck)*60)*6*(1-P(t,T.stuck,.6)):0;
      if(t>=T.rot)r=90*(1-eOB(P(t,T.rot,.3)))}
    else{r=0;dy=lerp(stuckDy,0,eIC(P(t,T.hard,.13)))}
    return{vis:t>=f,dy,dx:sh,r,land:t>=T.hard+.13?T.hard+.13:null}}
  const e=eIC(P(t,f,LAND));return{vis:t>=f,dy:-(y+h+60)*(1-e),dx:0,r:0,land:t>=f+LAND?f+LAND:null}}
const LANDS=()=>SK.map((_,k)=>k===3?T.hard+.13:T.fall[k]+LAND);

// ---------------- mascot ----------------
const HOME=[905,650],REST=[905,1300],CHM=[SX+16+101+45,SY+728],BTP=[540,SY+797],RK=[420,1640],DK=[660,1640];
const hopv=(t,t0,t1,a,b,h)=>{const p=P(t,t0,t1-t0),e=eIO(p);return{x:lerp(a[0],b[0],e),y:lerp(a[1],b[1],e)-Math.sin(Math.PI*p)*h,p,dir:Math.sign(b[0]-a[0])}};
function curState(t){let x=-300,y=0,rot=0,sx=1,sy=1,vis=t>=T.curIn&&t<T.outro0+.42,sc=.9,eye=1,lx=0,m=null;
  if(t<1.65)m=hopv(t,T.curIn,1.65,[540,1980],HOME,420);
  else if(t<T.rot-.42)m={x:HOME[0],y:HOME[1],p:1,idle:1};
  else if(t<T.rot)m=hopv(t,T.rot-.42,T.rot,HOME,RK,260);
  else if(t<T.hard-.4)m={x:RK[0],y:RK[1],p:1};
  else if(t<T.hard)m=hopv(t,T.hard-.4,T.hard,RK,DK,180);
  else if(t<T.hard+.25)m={x:DK[0],y:DK[1],p:1};
  else if(t<T.hard+.7)m=hopv(t,T.hard+.25,T.hard+.7,DK,REST,260);
  else if(t<T.size-.42)m={x:REST[0],y:REST[1],p:1,idle:1};
  else if(t<T.size)m=hopv(t,T.size-.42,T.size-.04,REST,CHM,240);
  else if(t<T.btn-.42)m={x:CHM[0],y:CHM[1],p:1};
  else if(t<T.btn)m=hopv(t,T.btn-.42,T.btn-.04,CHM,BTP,160);
  else if(t<T.toast+.05)m={x:BTP[0],y:BTP[1],p:1};
  else if(t<T.toast+.5)m=hopv(t,T.toast+.05,T.toast+.5,BTP,REST,220);
  else if(t<T.outro0)m={x:REST[0],y:REST[1],p:1,idle:1};
  else m=hopv(t,T.outro0,T.outro0+.4,REST,[-200,900],260);
  x=m.x;y=m.y;
  if(m.p<1){sy=1+.18*Math.sin(Math.PI*m.p);sx=1/sy;rot=Math.sin(Math.PI*m.p)*(m.dir>0?14:m.dir<0?-14:0)}
  for(const c of [1.65,T.hard+.7,T.toast+.5]){if(t>=c&&t<c+.18){const k2=Math.sin(Math.PI*(t-c)/.18);sy*=1-.25*k2;sx*=1+.2*k2}}
  for(const c of [T.rot,T.hard,T.size,T.btn]){if(t>=c&&t<c+.25){const q=Math.sin(Math.PI*P(t,c,.25));sy*=1-.3*q;sx*=1+.18*q}}
  T.planes.forEach(w=>{const q=P(t,w,.35);if(q>0&&q<1){y-=70*Math.sin(Math.PI*q);rot=-10*Math.sin(Math.PI*q)}});
  if(t>=T.stuck&&t<T.stuck+.6)eye=1.35;
  if(m.idle){y+=Math.sin(t*6)*5;rot=Math.sin(t*2.6)*7;lx=t<T.stuck+.6?-1.2:Math.sin(t*3)*1.2}
  // follow falling pieces with eyes
  if(t>=T.fall[0]&&t<T.stuck)lx=-1.3;
  return{x,y,rot,sx:sx*sc,sy:sy*sc,vis,eye,lx}}

{{GRAIN}}
const SH2=[[T.hookA+.05,8],...T.busy.map(b=>[b,5]),...LANDS().map(l=>[l,6]),[T.stuck,7],[T.rot,5],[T.hard+.13,14],[T.clear,8],[T.wave1,12],[T.size,4],[T.btn,7],...T.planes.map(w=>[w,5]),[T.drop,22],[T.t6b,14],[T.tile,10],[T.click2,10]];
const H=['x0','x1','x2','x3','x4'];
function star(x,y,r,a){let d=`M${x} ${y-r}`;for(let k=0;k<4;k++){const a2=(k+1)*Math.PI/2;d+=` Q${x} ${y} ${x+Math.sin(a2)*r} ${y-Math.cos(a2)*r}`}
  return `<path d="${d}" fill="#C8FF2E" stroke="none" transform="rotate(${a} ${x} ${y})"/>`}
const GL=[[SX+70,SY+200],[SX+360,SY+260],[SX+120,SY+520],[SX+330,SY+640],[SX+210,SY+800]];
const TET=[[[0,0],[1,0],[2,0],[1,1]],[[0,0],[0,1],[1,1],[2,1]],[[0,0],[1,0],[0,1],[1,1]]];
const OX=[380,700,540];

function render(t){
  $('dots').style.transform=`translate(${-t*12}px,${-t*20}px)`;
  $('g1').style.transform=`translate(${Math.sin(t*.5)*70}px,${Math.cos(t*.4)*60}px)`;$('g2').style.transform=`translate(${Math.cos(t*.45)*70}px,${Math.sin(t*.35)*70}px)`;
  let sx=0,sy=0;for(const [t0,a] of SH2){const d=t-t0;if(d>0&&d<.35){const k=Math.pow(1-d/.35,2);sx+=Math.sin(d*97)*a*k;sy+=Math.cos(d*83)*a*.6*k}}
  $('world').style.transform=`translate(${sx}px,${sy}px)`;grain(Math.round(t*60));
  let fl=0;for(const [t0,a] of [[T.drop,.38],[T.t6b,.2],[T.hard+.13,.1],[T.wave1,.12]]){const d=t-t0;if(d>=0&&d<.35)fl=Math.max(fl,a*(1-d/.35))}$('flashL').style.opacity=fl;

  if(show('sMain',t,0,18.1)){
    hline($('h0a'),t,T.hookA,T.hookOut,.22);hline($('h0b'),t,T.hookB,T.hookOut,.22);
    H.forEach((id,i)=>{hline($(id+'a'),t,T.hA[i],T.hOut[i],.4);hline($(id+'b'),t,T.hA[i]+.15,T.hOut[i],.4)});
    const sb=$('sub0');if(t<T.sub||t>2.7)sb.style.opacity=0;else{const p=eOC(P(t,T.sub,.4)),q=eIO(P(t,2.4,.3));sb.style.opacity=p*(1-q);sb.style.transform=`translateY(${(1-p)*24-q*40}px)`}
    // hook: ringing busy handset
    const hgo=eIC(P(t,2.3,.4));const hs=$('hs');hs.setAttribute('opacity',Math.min(1,P(t,0,.2))*(1-hgo));
    hs.setAttribute('transform',`translate(540 ${1060+hgo*500}) scale(${1+.04*Math.sin(t*30)*(t<2.3?1:0)})`);
    $('hsr').setAttribute('transform',`rotate(${Math.sin(t*38)*7})`);
