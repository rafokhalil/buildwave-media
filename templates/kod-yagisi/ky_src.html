$('site').innerHTML=SITE();
const SK=[[24,100,230,46],[16,166,394,270],[16,764,394,66],[16,464,190,230],[220,464,190,230],[16,706,394,44],[22,42,382,40]];
const CODE=['<em>&lt;logo/&gt;</em>',
 '<em>&lt;section</em> <u>hero</u><em>&gt;</em>\n  <em>&lt;h1&gt;</em>Aptek indi<em>&lt;/h1&gt;</em>\n  <em>&lt;p&gt;</em>Evə çatdırılma<em>&lt;/p&gt;</em>\n  <em>&lt;img</em> <u>src</u>="dərman"<em>/&gt;</em>\n  <em>&lt;a&gt;</em>Gecə də<em>&lt;/a&gt;</em>\n<em>&lt;/section&gt;</em>\n<u>// TODO: rəng</u>',
 '<em>&lt;button&gt;</em>Sifariş et<em>&lt;/button&gt;</em>',

 '<em>&lt;card&gt;</em>\n  <u>ad:</u> Sirop\n  <u>qiymət:</u> 9\n  <em>&lt;img/&gt;</em>\n  <em>&lt;btn/&gt;</em>\n<em>&lt;/card&gt;</em>',
 '<em>&lt;chips&gt;</em> 4 <em>&lt;/chips&gt;</em>',

// ---------------- rain ----------------
const GL='{}<>/=;()01[]$#*+əşğç₼'.split('');
const hsh=(a,b,c)=>{let h=(a*73856093)^(b*19349663)^(c*83492791);h=(h^(h>>>13))*1274126177;return ((h^(h>>>16))>>>0)};
const COLS=[...Array(20)].map((_,i)=>{const r=rnd(100+i*7);return{x:20+i*53+r()*12,v:520+r()*420,o:r()*2400,L:9+Math.floor(r()*7),fs:36+Math.floor(r()*14)}});
function rain(t,al,lime){if(al<=0)return '';let s='';
  COLS.forEach((c,i)=>{const per=1920+c.L*50+300;const S=t*c.v+c.o;const cyc=Math.floor(S/per);const yh=S-cyc*per-150;
    for(let j=0;j<c.L;j++){const y=yh-j*50;if(y<-40||y>1960)continue;
      const fl=(j>0&&hsh(i,j,Math.floor(t*7))%5==0);const g=GL[hsh(i,cyc,j+(fl?Math.floor(t*7):0))%GL.length];
      const fade=1-j/c.L;let col=j==0?'#F5F5FA':j<3?'#C8FF2E':(j%3==0?'#7B61FF':'#5D5D7A');if(lime&&j<5)col='#C8FF2E';
      let o=al*(j==0?1:.25+.75*fade);if(y<500)o*=.28;// keep the headline readable
      s+=`<text x="${c.x}" y="${y}" font-size="${c.fs}" fill="${col}" opacity="${o.toFixed(3)}">${g==='<'?'&lt;':g==='>'?'&gt;':g}</text>`}});
  return s}
function glyph(x,y,g,col,fs,o,rot=0){return `<text x="${x}" y="${y}" font-size="${fs}" fill="${col}" opacity="${o}" text-anchor="middle" transform="rotate(${rot} ${x} ${y})">${g==='<'?'&lt;':g==='>'?'&gt;':g}</text>`}
// ---------------- bug ----------------

  for(const k of [-1,1])for(const j of [-1,0,1])s+=`<line x1="0" y1="${j*12}" x2="${k*44}" y2="${j*16+(j==0?lg:-lg)*k}" stroke="#07070C" stroke-width="7"/>`;
  s+=`<ellipse cx="0" cy="0" rx="30" ry="38" fill="${red}" stroke="#07070C" stroke-width="5"/><line x1="0" y1="-30" x2="0" y2="36" stroke="#07070C" stroke-width="4"/><circle cx="-11" cy="-4" r="6" fill="#07070C"/><circle cx="12" cy="14" r="5" fill="#07070C"/>`;
  s+=`<circle cx="0" cy="-40" r="16" fill="#07070C"/><circle cx="-6" cy="-44" r="4" fill="#fff"/><circle cx="6" cy="-44" r="4" fill="#fff"/><line x1="-6" y1="-54" x2="-16" y2="-72" stroke="#07070C" stroke-width="4"/><line x1="6" y1="-54" x2="16" y2="-72" stroke="#07070C" stroke-width="4"/></g>`;return s}
// ---------------- mascot ----------------
const MID=[540,1260],REST=[935,1330],STP=[BUG[0]-40,BUG[1]-150],CHM=[SX+16+95,SY+464+90],BTP=[540,SY+797];
const hopv=(t,t0,t1,a,b,h)=>{const p=P(t,t0,t1-t0),e=eIO(p);return{x:lerp(a[0],b[0],e),y:lerp(a[1],b[1],e)-Math.sin(Math.PI*p)*h,p,dir:Math.sign(b[0]-a[0])}};

{{GRAIN}}
