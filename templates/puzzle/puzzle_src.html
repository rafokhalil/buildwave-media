<script>
{{HELPERS}}
// ---------------- puzzle geometry ----------------
const SX=327,SY=632;const Y=[0,170,420,580,730,856];
function edge(y,ltr){const b=y+42;return ltr?`L178 ${y} C196 ${y} 168 ${b} 213 ${b} C258 ${b} 230 ${y} 248 ${y} L426 ${y}`:`L248 ${y} C230 ${y} 258 ${b} 213 ${b} C168 ${b} 196 ${y} 178 ${y} L0 ${y}`}
function piecePath(i){let d=i==0?'M0 50 Q0 0 50 0 L376 0 Q426 0 426 50':`M0 ${Y[i]} `+edge(Y[i],true);
  if(i==4)d+=' L426 806 Q426 856 376 856 L50 856 Q0 856 0 806 Z';else d+=` L426 ${Y[i+1]} `+edge(Y[i+1],false)+' Z';return d}
const DUMB=`<svg width="170" height="110" viewBox="0 0 170 110" class="dmb"><rect x="30" y="49" width="110" height="12" rx="6" fill="#D4D4D8"/><rect x="18" y="22" width="22" height="66" rx="7" fill="#FAFAFA"/><rect x="4" y="32" width="16" height="46" rx="6" fill="#E4E4E7"/><rect x="130" y="22" width="22" height="66" rx="7" fill="#FAFAFA"/><rect x="150" y="32" width="16" height="46" rx="6" fill="#E4E4E7"/></svg>`;
const SITE=`<div class="st">18:00</div><div class="url">demirgym.az</div><div class="brand"><span class="logo">D</span>Dəmir Gym</div><div class="bur"></div>
<div class="hero"><div class="ht">Bu gün<br>başla.</div><div class="hs">İlk məşq hədiyyə</div>${DUMB}</div>
<div class="lb" style="top:426px">Abunə</div><div class="card" style="left:16px"><i>Aylıq</i><b>40 ₼</b></div><div class="card" style="left:220px"><i>Gündəlik</i><b>5 ₼</b></div>
<div class="lb" style="top:592px">Bu gün</div>`+['08:00','13:00','19:00'].map((h,k)=>`<div class="chip" id="CH${k}" style="left:${16+k*134}px">${h}</div>`).join('')+`<div class="btn" id="BTN">Məşqə yazıl</div>`;
$('pcs').innerHTML=[0,1,2,3,4].map(i=>`<div class="pcw" id="pw${i}"><div class="pci" style="clip-path:path('${piecePath(i)}')"><div class="site" id="st${i}">${SITE.replace(/id="(CH\d|BTN)"/g,'class="$1"').replace(/class="chip" class="(CH\d)"/g,'class="chip $1"').replace('class="btn" class="BTN"','class="btn BTN"')}</div>
<svg width="426" height="856" viewBox="0 0 426 856"><path id="po${i}" d="${piecePath(i)}" fill="none" stroke="#FFFFFF" stroke-width="7" opacity=".9"/></svg></div></div>`).join('');
$('slots').innerHTML=[0,1,2,3,4].map(i=>`<path id="sl${i}" d="${piecePath(i)}" fill="${i==4?'rgba(200,255,46,0)':'none'}" stroke="#3A3A4F" stroke-width="4" stroke-dasharray="14 10" transform="translate(0 0) scale(1)"/>`).join('');
$('seams').innerHTML=[1,2,3,4].map(k=>`<path d="M0 ${Y[k]} ${edge(Y[k],true)}" fill="none" stroke="#FFFFFF" stroke-width="4" opacity=".85"/>`).join('');
const CY=i=>(Y[i]+Y[i+1])/2;const SLOT=i=>[540,SY+CY(i)];
// hook jumble & parking (piece centre, rotation, scale)
const J=[[400,790,-14,.98],[690,1030,12,.98],[350,1270,9,.98],[710,1450,-11,.98]];
const PK=[[168,770,-12,.55],[912,880,10,.55],[162,1250,8,.55],[918,1360,-9,.55]];
const E_Y=SLOT(4)[1];
function pieceState(i,t){
  let x,y,r,s,lift=0,vis=1;
  if(i<4){
    const j=J[i],k=PK[i],sl=SLOT(i);const bob=Math.sin(t*2.1+i*1.7);
    const pp=eIO(P(t,T.park,.6));x=lerp(j[0],k[0],pp);y=lerp(j[1],k[1],pp)+bob*8;r=lerp(j[2],k[2],pp)+Math.sin(t*1.5+i)*2.5;s=lerp(j[3],k[3],pp);
    const ip=P(t,T.card+i*.1,.5);if(t<T.card+i*.1)vis=0;else{s*=.6+.4*eOB(ip)}
    if(t>=T.grab[i]){const c=P(t,T.grab[i],T.snap[i]-T.grab[i]);const e=eIO(c);
      const x0=k[0],y0=k[1]+bob*8;x=lerp(x0,sl[0],e);y=lerp(y0,sl[1],e)-Math.sin(Math.PI*c)*90;r=lerp(k[2],0,e);s=lerp(k[3],1,eOC(c));lift=Math.sin(Math.PI*c);
      if(c>=1){x=sl[0];y=sl[1];r=0;s=1;lift=0;const q=P(t,T.snap[i],.22);if(q<1)s=1+.035*Math.sin(Math.PI*q)}}
  }else{
    const sl=SLOT(4);y=sl[1];r=180;s=1;
    if(t<T.eIn0){vis=0;x=1500}
    else if(t<T.bonk){x=lerp(1500,650,eIO(P(t,T.eIn0,T.eIn1-T.eIn0)))}
    else if(t<T.spin0){const q=P(t,T.bonk,.3);x=lerp(650,720,eOC(q));r=180+Math.sin(q*Math.PI*3)*7*(1-q)}
    else if(t<T.spin1){x=720;const q=P(t,T.spin0,T.spin1-T.spin0);r=lerp(180,0,eOB(q));y=sl[1]-Math.sin(Math.PI*q)*60;lift=Math.sin(Math.PI*q)}
    else{const q=eIO(P(t,T.spin1,T.eSnap-T.spin1));x=lerp(720,540,q);r=0;if(t>=T.eSnap){x=540;const w=P(t,T.eSnap,.28);if(w<1)s=1+.05*Math.sin(Math.PI*w)}}
  }
  return{x,y,r,s,lift,vis}}

// ---------------- mascot ----------------
const HOME=[965,650];const OFF=[40,-20];
const pk=i=>[PK[i][0]+OFF[0],PK[i][1]+OFF[1]];const so=i=>[SLOT(i)[0]+OFF[0],SLOT(i)[1]+OFF[1]];
const CHP=[SX+284+63,SY+667],BTP=[540,SY+807],REST=[985,985],GAPP=[610,E_Y+10];
const K=[[T.curIn,1.65,540,1980,HOME[0],HOME[1],420,1,.9],
  [T.grab[0]-.45,T.grab[0]-.03,HOME[0],HOME[1],...pk(0),220,.9,.9]];
for(let i=1;i<4;i++)K.push([T.snap[i-1]+.15,T.grab[i]-.03,...so(i-1),...pk(i),220,.9,.9]);
K.push([T.snap[3]+.2,T.gap+.3,...so(3),...GAPP,200,.9,.9]);
K.push([T.runOff,T.runOff+.4,...GAPP,1260,E_Y,150,.9,.9]);
K.push([T.ex+.05,T.spin0,720+213+20,E_Y,720,E_Y-150,180,.9,.9]);
K.push([T.spin1-.02,T.spin1+.1,720,E_Y-150,720+213+20,E_Y,60,.9,.9]);
K.push([T.eSnap+.15,T.eSnap+.55,540+213+20,E_Y,...REST,260,.9,.9]);
K.push([T.chip-.42,T.chip-.04,...REST,CHP[0]+8,CHP[1]+6,200,.9,.9]);
K.push([T.btn-.42,T.btn-.04,CHP[0]+8,CHP[1]+6,BTP[0]+8,BTP[1]+6,180,.9,.9]);
K.push([T.toast+.4,T.toast+.8,BTP[0]+8,BTP[1]+6,...REST,240,.9,.9]);
K.push([T.outro0,T.outro0+.4,...REST,-200,900,260,.9,.9]);
const TAPS=[...T.grab,T.chip,T.btn];
function curState(t){let x=1200,y=1600,rot=0,sx=1,sy=1,vis=t>=T.curIn&&t<T.outro0+.42,sc=.9,eye=1,lx=0;
  let last=null;for(const k of K){if(t>=k[0])last=k}
  if(last){const [t0,t1,x0,y0,x1,y1,h,s0,s1]=last;const p=P(t,t0,t1-t0);const e=eIO(p);x=lerp(x0,x1,e);y=lerp(y0,y1,e)-Math.sin(Math.PI*p)*Math.abs(h);sc=lerp(s0,s1,e);
    if(p<1){sy=1+.18*Math.sin(Math.PI*p);sx=1/sy;rot=Math.sin(Math.PI*p)*(x1>x0?14:-14)}
    else{const lp=t-t1;if(lp<.18){const k2=Math.sin(Math.PI*lp/.18);sy=1-.25*k2;sx=1+.2*k2}}}
  let moving=false;for(const k of K){if(t>=k[0]-.02&&t<k[1]+.2)moving=true}
  // carrying a piece: ride on it
  for(let i=0;i<4;i++){if(t>=T.grab[i]&&t<T.snap[i]){const s=pieceState(i,t);x=s.x+OFF[0];y=s.y+OFF[1]-8;rot=-8+Math.sin(t*20)*4;moving=true}}
  // pushing E (from the right edge)
  if(t>=T.eIn0&&t<T.ex+.05){const s=pieceState(4,t);x=s.x+213+20;y=E_Y+Math.abs(Math.sin(t*18))*-10;rot=-28;moving=true;if(t>=T.bonk){rot=-28+30*Math.sin(Math.PI*P(t,T.bonk,.3));eye=1.3}}
  if(t>=T.spin0&&t<T.spin1){const s=pieceState(4,t);x=720;y=s.y-150-Math.abs(Math.sin(t*14))*12;rot=Math.sin(t*20)*10;moving=true}
  if(t>=T.spin1+.1&&t<T.eSnap+.15){const s=pieceState(4,t);x=s.x+213+20;y=E_Y;rot=-28;moving=true}
  for(const c of TAPS){if(t>=c&&t<c+.25){const q=Math.sin(Math.PI*P(t,c,.25));sy*=1-.28*q;sx*=1+.16*q;moving=true}}
  for(const c of T.snap){if(t>=c&&t<c+.25){const q=Math.sin(Math.PI*P(t,c,.25));sy*=1-.25*q;sx*=1+.15*q}}
  // looking around for the missing piece
  if(t>=T.gap+.3&&t<T.runOff&&!moving){lx=Math.sin((t-T.gap)*5)*1.6;rot=Math.sin((t-T.gap)*5)*16;y-=Math.abs(Math.sin((t-T.gap)*5))*8;moving=true}
  if(t>=T.wave0&&t<T.wave1+.2&&!moving){lx=-1.2;rot=-10;moving=true}
  if(!moving&&vis){y+=Math.sin(t*6)*5;rot=Math.sin(t*2.6)*7}
  return{x,y,rot,sx:sx*sc,sy:sy*sc,vis,eye,lx}}

{{GRAIN}}
const SH2=[[T.hookA+.05,8],...T.snap.map(c=>[c,7]),[T.bonk,12],[T.eSnap,14],[T.wave1,9],[T.chip,4],[T.btn,7],[T.drop,22],[T.t6b,14],[T.tile,10],[T.click2,10]];
const H=['x0','x1','x2','x3','x4'];

function render(t){
  $('dots').style.transform=`translate(${-t*12}px,${-t*20}px)`;
  $('g1').style.transform=`translate(${Math.sin(t*.5)*70}px,${Math.cos(t*.4)*60}px)`;$('g2').style.transform=`translate(${Math.cos(t*.45)*70}px,${Math.sin(t*.35)*70}px)`;
  let sx=0,sy=0;for(const [t0,a] of SH2){const d=t-t0;if(d>0&&d<.35){const k=Math.pow(1-d/.35,2);sx+=Math.sin(d*97)*a*k;sy+=Math.cos(d*83)*a*.6*k}}
  $('world').style.transform=`translate(${sx}px,${sy}px)`;grain(Math.round(t*60));
  let fl=0;for(const [t0,a] of [[T.drop,.38],[T.t6b,.2],[T.eSnap,.14],[T.wave1,.1]]){const d=t-t0;if(d>=0&&d<.35)fl=Math.max(fl,a*(1-d/.35))}$('flashL').style.opacity=fl;

  if(show('sMain',t,0,18.1)){
    hline($('h0a'),t,T.hookA,T.hookOut,.22);hline($('h0b'),t,T.hookB,T.hookOut,.22);
    H.forEach((id,i)=>{hline($(id+'a'),t,T.hA[i],T.hOut[i],.4);hline($(id+'b'),t,T.hA[i]+.15,T.hOut[i],.4)});
    const sb=$('sub0');if(t<T.sub||t>2.7)sb.style.opacity=0;else{const p=eOC(P(t,T.sub,.4)),q=eIO(P(t,2.4,.3));sb.style.opacity=p*(1-q);sb.style.transform=`translateY(${(1-p)*24-q*40}px)`}
    // rig (phone + pieces) — bounce on the final snap & wave, fade out at outro
    const fo=eIC(P(t,T.outro0,.45));let rs=1;
    for(const [c,a] of [[T.eSnap,.03],[T.wave1,.035]]){const q=P(t,c,.35);if(q>0&&q<1)rs+=a*Math.sin(Math.PI*q)}
    $('rig').style.opacity=1-fo;$('rig').style.transform=`translateY(${fo*80}px) scale(${rs*(1-.12*fo)})`;
    const ph=$('ph');if(t<T.phone)ph.style.opacity=0;else{const pi=eOC(P(t,T.phone,.5));ph.style.opacity=pi;ph.style.transform=`translateY(${(1-pi)*900}px)`}
    // empty slot E pulses
    const sl4=$('sl4');if(t>=T.gap&&t<T.eSnap){const pu=.5+.5*Math.sin((t-T.gap)*9);sl4.setAttribute('stroke',`rgba(200,255,46,${.45+.55*pu})`);sl4.setAttribute('fill',`rgba(200,255,46,${.06+.08*pu})`)}else{sl4.setAttribute('stroke','#3A3A4F');sl4.setAttribute('fill','none')}
    // pieces
    for(let i=0;i<5;i++){const s=pieceState(i,t),w=$('pw'+i);w.style.opacity=s.vis?1:0;
      const dx=s.x-540,dy=s.y-(SY+CY(i));w.style.transformOrigin=`213px ${CY(i)}px`;
      w.style.transform=`translate(${dx}px,${dy}px) rotate(${s.r}deg) scale(${s.s})`;
      w.style.filter=t>=T.wave1-.3?'none':`drop-shadow(0 ${14+30*s.lift}px ${20+30*s.lift}px rgba(0,0,0,${.45+.25*s.lift}))`;
      $('po'+i).setAttribute('opacity',t>=T.eSnap?0:.9)}
    // z-order: the piece being carried on top
    let top=-1;for(let i=0;i<4;i++)if(t>=T.grab[i]&&t<T.snap[i]+.1)top=i;if(t>=T.eIn0)top=4;
    for(let i=0;i<5;i++)$('pw'+i).style.zIndex=i==top?5:1;
    // seams + lime wave melting them
    const wv=eIO(P(t,T.wave0,T.wave1-T.wave0)),wx=lerp(-160,1240,wv);
