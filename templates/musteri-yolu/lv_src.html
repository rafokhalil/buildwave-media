<script>
{{HELPERS}}
const SX=327,SY=652;
const D=(x,y,w,h,c,r=0,ex='')=>`<div style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${c};border-radius:${typeof r=='number'?r+'px':r};${ex}"></div>`;
const IMG1=D(0,0,166,116,'#FFF1E0')+D(36,92,94,12,'#E5D2BE',6)+D(52,44,62,52,'#fff','0 0 24px 24px')+D(52,38,62,14,'#B07A4E','50%')+D(108,52,18,22,'transparent','0 10px 10px 0','border:5px solid #fff;border-left:none')+D(70,10,6,22,'#E5D2BE',3)+D(88,4,6,26,'#E5D2BE',3);
const IMG2=D(0,0,166,116,'#FFF6E5')+D(28,50,110,44,'#E0A458','50%')+D(46,40,74,44,'#EDB96A','50%')+D(64,42,6,40,'#B9772F',3,'transform:rotate(-18deg)')+D(82,40,6,44,'#B9772F',3)+D(100,42,6,40,'#B9772F',3,'transform:rotate(18deg)');
function CUP(){return D(250,232,140,16,'#C99B70',8)+D(268,146,92,90,'#fff','0 0 40px 40px')+D(268,138,92,20,'#8A5530','50%')+D(352,160,30,40,'transparent','0 18px 18px 0','border:8px solid #fff;border-left:none')+D(288,84,9,42,'rgba(255,255,255,.85)',5)+D(310,72,9,52,'rgba(255,255,255,.85)',5)+D(332,86,9,40,'rgba(255,255,255,.85)',5)}
function SITE(){return `<div class="stt">18:00</div><div class="url">demkofe.az</div><div class="brand"><span class="logo"></span>Dəm Kofe</div><div class="menu"></div>
<div class="hero"><div class="ht">Səhər kofesi<br>qapında</div><div class="hs">Bakı · Evə çatdırılma</div><div class="tag">Yeni menyu</div>${CUP()}</div>
<div class="card" id="cd0" style="left:16px"><div class="im">${IMG1}</div><div class="nm">Latte</div><div class="pr">5 ₼</div></div>
<div class="card" style="left:220px"><div class="im">${IMG2}</div><div class="nm">Kruassan</div><div class="pr">3 ₼</div></div>
<div class="chips"><div class="chp">Hamısı</div><div class="chp">Kofe</div><div class="chp">Çay</div><div class="chp">Desert</div></div>
<div class="btn" id="BTN">Sifariş et</div>`}
$('site').innerHTML=SITE();
const SK=[[24,100,250,46],[16,166,394,270],[16,764,394,66],[16,464,190,230],[220,464,190,230],[16,706,394,44],[22,42,382,40]];
const ICO='<svg width="40" height="34" viewBox="0 0 40 34"><rect x="2" y="2" width="36" height="30" rx="6" fill="none" stroke="#A9A9C2" stroke-width="3"/><path d="M6 28 L16 16 L23 23 L28 18 L35 28" fill="none" stroke="#A9A9C2" stroke-width="3" stroke-linejoin="round"/><circle cx="28" cy="10" r="3" fill="#A9A9C2"/></svg>';
const LBL=['Logo',ICO+'Şəkil','Düymə',ICO+'Latte · 5 ₼','Kruassan','Kateqoriya','demkofe.az'];
const ORD=[0,6,1,3,4,5,2];
$('skel').innerHTML=SK.map(([x,y,w,h],k)=>`<i style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"></i>`).join('')+SK.map(([x,y,w,h],k)=>`<b style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">${LBL[k]}</b>`).join('');
const FT=k=>T.fill[ORD.indexOf(k)];
// ---------------- platformer level ----------------
const CX0=150,CX1=930,CY0=660,CY1=1530;
const PX=[275,425,575,725],PY=[1390,1280,1170,1060],FN=['Logo','Şəkil','Qiymət','Düymə'];
const FLX=860,FLY=950,GND=1452,HOLE=[650,800];
const LND=[1.4,3.3,3.9],JMP=[3.0,3.6];
const FLYSK=[0,1,3,2],FLYT=()=>[T.fill[0],T.fill[2],T.fill[3],T.fill[6]];
const FLAG0=6.25,PILL=6.3;
function chipSvg(k,x,y,sc,o,on,w=130){const h=48;return `<g opacity="${o}" transform="translate(${x} ${y}) scale(${sc})"><rect x="${-w/2}" y="${-h/2+8}" width="${w}" height="${h}" rx="14" fill="rgba(0,0,0,.45)"/><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="14" fill="${on?'#C8FF2E':'#1E1E2B'}" stroke="${on?'#07070C':'#3A3A4F'}" stroke-width="4"/>
  <text y="9" text-anchor="middle" style="font-family:'Inter Display'" font-weight="800" font-size="25" fill="${on?'#07070C':'#A9A9C2'}">${FN[k]}</text></g>`}
function coin(x,y,t,o=1){const sx=Math.abs(Math.cos(t*4));return `<g opacity="${o}" transform="translate(${x} ${y}) scale(${Math.max(.15,sx)} 1)"><circle r="24" fill="#C8FF2E" stroke="#07070C" stroke-width="4"/><text y="10" text-anchor="middle" font-family="DejaVu Sans" font-weight="700" font-size="26" fill="#07070C">₼</text></g>`}
function levelSvg(t){let s=`<rect x="${CX0+8}" y="${CY0+16}" width="${CX1-CX0}" height="${CY1-CY0}" rx="60" fill="rgba(0,0,0,.45)"/>
  <rect x="${CX0}" y="${CY0}" width="${CX1-CX0}" height="${CY1-CY0}" rx="60" fill="#12121B" stroke="#3A3A4F" stroke-width="6"/>
  <clipPath id="lvc"><rect x="${CX0+3}" y="${CY0+3}" width="${CX1-CX0-6}" height="${CY1-CY0-6}" rx="57"/></clipPath><g clip-path="url(#lvc)">`;
  for(let i=1;i<20;i++)s+=`<line x1="${CX0+i*40}" y1="${CY0}" x2="${CX0+i*40}" y2="${CY1}" stroke="#1A1A26" stroke-width="2"/>`;
  for(let i=1;i<22;i++)s+=`<line x1="${CX0}" y1="${CY0+i*40}" x2="${CX1}" y2="${CY0+i*40}" stroke="#1A1A26" stroke-width="2"/>`;
  // clouds
  [[300,880,1],[700,800,.8],[1000,1000,.7]].forEach(([x,y,sc],i)=>{const xx=((x-t*(18+i*8))%900+900)%900+120;s+=`<g transform="translate(${xx} ${y}) scale(${sc})" opacity=".9"><rect x="-70" y="-20" width="140" height="40" rx="20" fill="#1E1E2B"/><circle cx="-20" cy="-22" r="30" fill="#1E1E2B"/><circle cx="24" cy="-14" r="22" fill="#1E1E2B"/></g>`});
  // ground with a hole (spikes)
  s+=`<rect x="${CX0}" y="${GND}" width="${HOLE[0]-CX0}" height="200" fill="#1E1E2B"/><rect x="${HOLE[1]}" y="${GND}" width="${CX1-HOLE[1]}" height="200" fill="#1E1E2B"/>
  <line x1="${CX0}" y1="${GND}" x2="${HOLE[0]}" y2="${GND}" stroke="#3A3A4F" stroke-width="5"/><line x1="${HOLE[1]}" y1="${GND}" x2="${CX1}" y2="${GND}" stroke="#3A3A4F" stroke-width="5"/>
  <rect x="${HOLE[0]}" y="${GND}" width="${HOLE[1]-HOLE[0]}" height="200" fill="#07070C"/>`;
  for(let i=0;i<6;i++){const x=HOLE[0]+8+i*24;s+=`<path d="M${x} 1530 L${x+12} 1494 L${x+24} 1530 Z" fill="#FF4D5E" opacity=".85"/>`}
  s+='</g>';
  // readout
  const got=t>=FLAG0;const bad=t>=T.jam&&t<T.st[2];const blink=bad&&Math.floor(t*6)%2==0;
  s+=`<rect x="380" y="${CY0+26}" width="320" height="56" rx="16" fill="#07070C" stroke="${bad?'#FF4D5E':got?'#C8FF2E':'#2B2B3A'}" stroke-width="3"/>
  <text x="540" y="${CY0+65}" text-anchor="middle" font-family="DejaVu Sans Mono" font-weight="700" font-size="28" fill="${got?'#C8FF2E':blink?'#FF4D5E':bad?'#7A2A33':'#FF4D5E'}">SİFARİŞ: ${got?'VAR ✓':'YOX'}</text>`;
  // coin HUD
  let n=0;LND.forEach(w=>{if(t>=w)n++});
  s+=`${coin(214,CY0+54,0)}<text x="248" y="${CY0+66}" font-family="DejaVu Sans Mono" font-weight="700" font-size="30" fill="#F5F5FA">×${n}</text>`;
  // coins above platforms
  for(let k=0;k<3;k++){const w=LND[k],cx=PX[k],cy=PY[k]-170+Math.sin(t*3+k)*6;
    if(t<w)s+=coin(cx,cy,t+k);else if(t<w+.45){const q=P(t,w,.45);s+=coin(cx,cy-q*90,t*3,1-q)+`<text x="${cx+30}" y="${cy-30-q*60}" font-family="Inter Display" font-weight="800" font-size="38" fill="#C8FF2E" opacity="${1-q}">+1</text>`}}
  // platforms
  for(let k=0;k<3;k++)s+=chipSvg(k,PX[k],PY[k],1,1,false);
  // gap slot
  const jam=t>=T.jam&&t<T.st[2];{const o=jam?(Math.floor(t*6)%2?1:.45):.55;if(t<T.st[2]+.1)s+=`<rect x="${PX[3]-70}" y="${PY[3]-28}" width="140" height="56" rx="16" fill="none" stroke="${jam?'#FF4D5E':'#3A3A4F'}" stroke-width="4" stroke-dasharray="12 9" opacity="${o}"/><text x="${PX[3]}" y="${PY[3]+12}" text-anchor="middle" font-family="Inter Display" font-weight="800" font-size="34" fill="${jam?'#FF4D5E':'#3A3A4F'}" opacity="${o}">?</text>`}
  // bridge pieces drop in
  if(t<T.st[2]+.02){for(let i=0;i<3;i++){const w=T.st[i];if(t<w-.3)continue;const q=eIC(P(t,w-.3,.3));const y=lerp(PY[3]-620,PY[3],q);s+=`<rect x="${PX[3]-65+i*43.3+1}" y="${y-24}" width="41" height="48" rx="10" fill="#C8FF2E" stroke="#07070C" stroke-width="4"/>`}}
  else s+=chipSvg(3,PX[3],PY[3],1,1,true);
  // flag platform
  s+=`<rect x="${FLX-60}" y="${FLY-24+8}" width="120" height="48" rx="14" fill="rgba(0,0,0,.45)"/><rect x="${FLX-60}" y="${FLY-24}" width="120" height="48" rx="14" fill="#1E1E2B" stroke="#3A3A4F" stroke-width="4"/>
  <line x1="${FLX+38}" y1="${FLY-24}" x2="${FLX+38}" y2="${FLY-230}" stroke="#A9A9C2" stroke-width="7" stroke-linecap="round"/><circle cx="${FLX+38}" cy="${FLY-236}" r="9" fill="#A9A9C2"/>`;
  const fq=eOB(P(t,FLAG0,.3));const fy=lerp(FLY-80,FLY-222,fq);
  s+=`<path d="M${FLX+34} ${fy} L${FLX-38} ${fy+22+Math.sin(t*9)*4} L${FLX+34} ${fy+46} Z" fill="${t>=FLAG0?'#C8FF2E':'#3A3A4F'}" stroke="#07070C" stroke-width="3" stroke-linejoin="round"/>`;
  return s}
// ---------------- mascot ----------------
const ST=k=>k<4?[PX[k]-45,PY[k]-24-104]:[FLX-55,FLY-24-104];
const REST=[935,1330],CHM=[SX+16+95,SY+464+90],BTP=[540,SY+797];
const hopv=(t,t0,t1,a,b,h)=>{const p=P(t,t0,t1-t0),e=eIO(p);return{x:lerp(a[0],b[0],e),y:lerp(a[1],b[1],e)-Math.sin(Math.PI*p)*h,p,dir:Math.sign(b[0]-a[0])}};
function curState(t){let x=-300,y=0,rot=0,sx=1,sy=1,vis=t>=T.curIn&&t<T.outro0+.42,sc=.9,eye=1,lx=0,m=null,o=1;
  if(t<1.4)m=hopv(t,T.curIn,1.4,[300,1980],ST(0),380);
  else if(t<JMP[0])m={x:ST(0)[0],y:ST(0)[1],p:1};
