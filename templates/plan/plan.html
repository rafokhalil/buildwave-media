<script>

const T=window.T;const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));const P=(t,t0,d)=>clamp((t-t0)/d);
const eOC=x=>1-Math.pow(1-x,3),eOQ=x=>1-Math.pow(1-x,5),eIC=x=>x*x*x,eIQ=x=>x*x,eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eOB=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};const lerp=(a,b,p)=>a+(b-a)*p;
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function pop(el,t,t0,o={}){const d=o.d??0.5,y=o.y??40,x=o.x??0,s0=o.s??0.86,b=o.b??0;
  if(t<t0){el.style.opacity=0;return 0}const p=P(t,t0,d),e=eOB(p),oc=eOC(p);
  el.style.opacity=eOC(clamp(p*2.4));el.style.transform=`translate(${(1-oc)*x}px,${(1-oc)*y}px) scale(${s0+(1-s0)*e})`;
  el.style.filter=b?`blur(${(1-eOC(clamp(p*2.2)))*b}px)`:'';return p}
function show(id,t,a,b){const el=$(id);const on=t>=a&&t<=b;el.style.display=on?'block':'none';return on}
function hline(el,t,t0,tout,d=.5){if(t<t0){el.style.opacity=0;return}const p=P(t,t0,d);let sc=lerp(1.5,1,eOQ(p)),op=eOC(clamp(p*2.5)),bl=(1-eOC(p))*18,y=0;
  if(tout!==undefined&&t>tout){const q=eIO(P(t,tout,.35));y=-q*80;op*=1-q;bl+=q*10}
  el.style.opacity=op;el.style.transformOrigin='0 50%';el.style.transform=`translateY(${y}px) scale(${sc})`;el.style.filter=`blur(${bl}px)`}
function lines(cx,cy,n,R,len,bp,col,w){let h='';for(let i=0;i<n;i++){const a=i/n*Math.PI*2+.3,r1=R+150*eOC(bp),r2=r1+len*(1-bp);
  h+=`<line x1="${cx+Math.cos(a)*r1}" y1="${cy+Math.sin(a)*r1}" x2="${cx+Math.cos(a)*r2}" y2="${cy+Math.sin(a)*r2}" stroke="${col}" stroke-width="${w}" opacity="${1-bp}"/>`}return h}


// ---------------- geometry (screen coords 426x856) ----------------
const SX=327,SY=632;
const B=[[16,96,394,56],[16,166,394,270],[16,464,394,230],[16,764,394,66]];
const NM=['Logo','Şəkil','Məhsullar','Düymə'];
const R=[16,24,20,33];
function per(i,p){const [x,y,w,h]=B[i];let d=p*2*(w+h);if(d<w)return[x+d,y];d-=w;if(d<h)return[x+w,y+d];d-=h;if(d<w)return[x+w-d,y+h];d-=w;return[x,y+h-d]}
const W=(i,p)=>{const q=per(i,p);return[SX+q[0],SY+q[1]]};
// blueprint svg
let bp='';B.forEach((b,i)=>{const [x,y,w,h]=b;
  bp+=`<path id="bl${i}" pathLength="1" d="M${x} ${y} h${w} v${h} h${-w} Z" fill="none" stroke="#9D8BFF" stroke-width="3.5" stroke-dasharray="1" stroke-dashoffset="1"/>`;
  bp+=`<text id="bt${i}" x="${x+w/2}" y="${y+h/2+10}" text-anchor="middle" font-family="Inter Display, Inter, sans-serif" font-weight="700" font-size="${i==0?24:30}" fill="#9D8BFF" opacity="0">${NM[i]}</text>`});
bp+=`<g id="dim" opacity="0" stroke="#7B61FF" stroke-width="2.5"><line x1="16" y1="150" x2="410" y2="150"/><line x1="16" y1="142" x2="16" y2="158"/><line x1="410" y1="142" x2="410" y2="158"/></g>`;
bp+=`<text id="dimt" x="213" y="146" text-anchor="middle" font-family="Inter Display, Inter, sans-serif" font-weight="700" font-size="18" fill="#C8FF2E" opacity="0">394 px</text>`;
bp+=`<g id="cdiv" opacity="0" stroke="#9D8BFF" stroke-width="3" stroke-dasharray="10 8"><line x1="213" y1="474" x2="213" y2="684"/><rect x="28" y="476" width="170" height="112" rx="12" fill="none"/><rect x="230" y="476" width="168" height="112" rx="12" fill="none"/></g>`;
bp+=`<g id="hdiv" opacity="0" stroke="#9D8BFF" stroke-width="3" stroke-dasharray="10 8" fill="none"><rect x="160" y="300" width="230" height="110" rx="16"/><line x1="40" y1="200" x2="200" y2="200"/><line x1="40" y1="240" x2="160" y2="240"/></g>`;
$('bp').innerHTML=bp;
// slabs
const BARS=[[[64,20,150]],[[24,30,180],[24,62,120],[24,214,110]],[[14,140,120],[14,172,80],[210,140,120],[210,172,80]],[[130,25,134]]];
$('slabs').innerHTML=B.map((b,i)=>`<div class="slab" id="sb${i}" style="left:${12+b[0]}px;top:${12+b[1]}px;width:${b[2]}px;height:${b[3]}px;border-radius:${R[i]}px"><div class="side"></div><div class="top">`+
  BARS[i].map(r=>`<div class="bar" style="left:${r[0]}px;top:${r[1]}px;width:${r[2]}px"></div>`).join('')+(i==2?'<div class="bar" style="left:12px;top:10px;width:168px;height:116px;border-radius:14px"></div><div class="bar" style="left:208px;top:10px;width:172px;height:116px;border-radius:14px"></div>':'')+(i==0?'<div class="bar" style="left:8px;top:8px;width:40px;height:40px;border-radius:12px"></div>':'')+`</div></div>`).join('');
function SOFA(w,col1,col2,col3,id){const k=w/230;const s=(x,y,ww,hh,r,c)=>`<i style="left:${x*k}px;top:${y*k}px;width:${ww*k}px;height:${hh*k}px;border-radius:${r*k}px;background:${c}"></i>`;
  return `<div class="sofa" ${id?`id="${id}"`:''} style="width:${w}px;height:${100*k}px">`+s(14,0,202,56,20,col1)+s(0,44,230,40,14,col2)+s(0,24,32,62,13,col3)+s(198,24,32,62,13,col3)+s(14,82,10,16,3,'#3B2A1E')+s(206,82,10,16,3,'#3B2A1E')+`</div>`}
function CHAIR(w){const k=w/120;const s=(x,y,ww,hh,r,c)=>`<i style="left:${x*k}px;top:${y*k}px;width:${ww*k}px;height:${hh*k}px;border-radius:${r*k}px;background:${c}"></i>`;
  return `<div class="sofa" style="width:${w}px;height:${110*k}px">`+s(18,0,84,66,22,'#C9853F')+s(8,52,104,36,12,'#D9974F')+s(0,30,24,62,11,'#B5733A')+s(96,30,24,62,11,'#B5733A')+s(16,88,8,18,3,'#3B2A1E')+s(96,88,8,18,3,'#3B2A1E')+`</div>`}
$('site').innerHTML=`<div class="stt">18:00</div><div class="url">rahatmebel.az</div><div class="brand"><span class="logo">R</span>Rahat Mebel</div><div class="bur"></div>
<div class="hero"><div class="ht">Evə<br>rahatlıq.</div><div class="hs">Divanlar · kreslolar</div><div class="tag">890 ₼</div>
<div style="position:absolute;left:150px;top:146px">${SOFA(230,'#3F6B4F','#4E7F5F','#355C43','bigSofa')}</div></div>
<div class="card" id="cd0" style="left:16px"><div class="im"><div style="position:absolute;left:18px;top:30px">${SOFA(130,'#3F6B4F','#4E7F5F','#355C43')}</div></div><div class="nm">Divan</div><div class="pr">890 ₼</div></div>
<div class="card" id="cd1" style="left:220px"><div class="im"><div style="position:absolute;left:44px;top:18px">${CHAIR(80)}</div></div><div class="nm">Kreslo</div><div class="pr">240 ₼</div></div>
<div class="del">Bakıda çatdırılma — pulsuz</div><div class="btn" id="BTN">Səbətə at</div>`;

// crooked slab (index 2)
function crk(t){if(t<T.st[0]){return[9,26,-14]}if(t<T.fix){const q=P(t,T.st[0],.25);return[lerp(9,5,eOB(q)),lerp(26,14,eOB(q)),lerp(-14,-8,eOB(q))]}
  const q=P(t,T.fix,.3);return[lerp(5,0,eOB(q)),lerp(14,0,eOB(q)),lerp(-8,0,eOB(q))]}
function tiltK(t){return eIO(P(t,T.tilt0,T.tilt1-T.tilt0))*(1-eIO(P(t,T.flat0,T.flat1-T.flat0)))}
function slabZ(i,t){const L=T.land[i];if(t<L-T.fall)return null;if(t<L){const p=P(t,L-T.fall,T.fall);return{z:lerp(560,18,eIQ(p)),o:clamp(p*3)}}
  const q=P(t,L,.32);let z=18+(q<1?14*Math.sin(Math.PI*q)*(1-q):0);z=lerp(z,1,eIO(P(t,T.flat0,T.flat1-T.flat0)));return{z,o:1}}

// ---------------- mascot ----------------
const HOME=[930,580],REST=[930,1490],STOMP=[602,1088],SOFAP=[604,950],CHP=[445,1212],BTP=[540,SY+797];
const K=[[T.curIn,1.65,540,1980,HOME[0],HOME[1],420,1,.9]];
let prev=HOME;T.draw.forEach((d,i)=>{const s=W(i,0);K.push([d-.34,d-.02,...prev,...s,170,.9,.9]);prev=s});
K.push([T.draw[3]+T.dd+.05,T.draw[3]+T.dd+.45,...prev,...REST,240,.9,.9]);
K.push([T.ex+.1,T.st[0]-.25,...REST,...STOMP,260,.9,.9]);
T.st.forEach(s=>K.push([s-.26,s,...STOMP,...STOMP,120,.9,.9]));
K.push([T.fix+.35,T.fix+.75,...STOMP,...REST,240,.9,.9]);
K.push([T.sofa-.42,T.sofa,...REST,...SOFAP,260,.9,.9]);
T.boing.forEach(s=>K.push([s-.02,s+.26,...SOFAP,...SOFAP,110,.9,.9]));
K.push([T.chip-.42,T.chip-.04,...SOFAP,...CHP,200,.9,.9]);
K.push([T.btn-.42,T.btn-.04,...CHP,BTP[0]+8,BTP[1]+6,180,.9,.9]);
K.push([T.toast+.4,T.toast+.8,BTP[0]+8,BTP[1]+6,...REST,240,.9,.9]);
K.push([T.outro0,T.outro0+.4,...REST,-200,900,260,.9,.9]);
const TAPS=[T.chip,T.btn,...T.st];
function curState(t){let x=1200,y=1600,rot=0,sx=1,sy=1,vis=t>=T.curIn&&t<T.outro0+.42,sc=.9,eye=1,lx=0;
  let last=null;for(const k of K){if(t>=k[0])last=k}
  if(last){const [t0,t1,x0,y0,x1,y1,h,s0,s1]=last;const p=P(t,t0,t1-t0);const e=eIO(p);x=lerp(x0,x1,e);y=lerp(y0,y1,e)-Math.sin(Math.PI*p)*Math.abs(h);sc=lerp(s0,s1,e);
    if(p<1){sy=1+.18*Math.sin(Math.PI*p);sx=1/sy;rot=Math.sin(Math.PI*p)*(x1>x0?14:x1<x0?-14:0)}
    else{const lp=t-t1;if(lp<.18){const k2=Math.sin(Math.PI*lp/.18);sy=1-.25*k2;sx=1+.2*k2}}}
  let moving=false;for(const k of K){if(t>=k[0]-.02&&t<k[1]+.2)moving=true}
  // drawing: pen tip follows the outline
  T.draw.forEach((d,i)=>{if(t>=d&&t<d+T.dd){const q=W(i,eIO(P(t,d,T.dd)));x=q[0];y=q[1];rot=-6+Math.sin(t*30)*5;moving=true}});
  for(const c of TAPS){if(t>=c&&t<c+.25){const q=Math.sin(Math.PI*P(t,c,.25));sy*=1-.28*q;sx*=1+.16*q;moving=true}}
  // 3D phase: look up at falling slabs, hop at each landing
  if(t>=T.tilt0&&t<T.flat1&&!moving){lx=-1.2;rot=-12+Math.sin(t*3)*4;eye=1;moving=true}
  for(const c of T.land){if(t>=c&&t<c+.3){const q=Math.sin(Math.PI*P(t,c,.3));y-=q*40;sy*=1+.12*q;sx*=1-.08*q}}
  if(t>=T.ex&&t<T.ex+.3)eye=1.3;
  if(!moving&&vis){y+=Math.sin(t*6)*5;rot=Math.sin(t*2.6)*7}
  return{x,y,rot,sx:sx*sc,sy:sy*sc,vis,eye,lx}}

const gctx=$('grain').getContext('2d');const gimg=gctx.createImageData(540,960);
function grain(fr){const r=rnd(fr*7919+13);const d=gimg.data;for(let i=0;i<d.length;i+=4){const v=r()*255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255}gctx.putImageData(gimg,0,0)}

const SH2=[[T.hookA+.05,8],...T.land.map(c=>[c,10]),...T.st.map(c=>[c,8]),[T.fix,12],[T.wave1,9],...T.boing.map(c=>[c,4]),[T.chip,4],[T.btn,7],[T.drop,22],[T.t6b,14],[T.tile,10],[T.click2,10]];
const H=['x0','x1','x2','x3','x4'];

function render(t){
  $('dots').style.transform=`translate(${-t*12}px,${-t*20}px)`;
  $('g1').style.transform=`translate(${Math.sin(t*.5)*70}px,${Math.cos(t*.4)*60}px)`;$('g2').style.transform=`translate(${Math.cos(t*.45)*70}px,${Math.sin(t*.35)*70}px)`;
  let sx=0,sy=0;for(const [t0,a] of SH2){const d=t-t0;if(d>0&&d<.35){const k=Math.pow(1-d/.35,2);sx+=Math.sin(d*97)*a*k;sy+=Math.cos(d*83)*a*.6*k}}
  $('world').style.transform=`translate(${sx}px,${sy}px)`;grain(Math.round(t*60));
  let fl=0;for(const [t0,a] of [[T.drop,.38],[T.t6b,.2],[T.fix,.12],[T.wave1,.1]]){const d=t-t0;if(d>=0&&d<.35)fl=Math.max(fl,a*(1-d/.35))}$('flashL').style.opacity=fl;

  if(show('sMain',t,0,18.1)){
    hline($('h0a'),t,T.hookA,T.hookOut,.22);hline($('h0b'),t,T.hookB,T.hookOut,.22);
    H.forEach((id,i)=>{hline($(id+'a'),t,T.hA[i],T.hOut[i],.4);hline($(id+'b'),t,T.hA[i]+.15,T.hOut[i],.4)});
    const sb=$('sub0');if(t<T.sub||t>2.7)sb.style.opacity=0;else{const p=eOC(P(t,T.sub,.4)),q=eIO(P(t,2.4,.3));sb.style.opacity=p*(1-q);sb.style.transform=`translateY(${(1-p)*24-q*40}px)`}
    // phone / tilt
    const fo=eIC(P(t,T.outro0,.45));const k=tiltK(t);let rs=1;
    for(const [c,a] of [[T.fix,.025],[T.wave1,.035]]){const q=P(t,c,.35);if(q>0&&q<1)rs+=a*Math.sin(Math.PI*q)}
    const pi=eOC(P(t,T.phone,.5));const tl=$('tilt');tl.style.opacity=Math.min(pi*2,1)*(1-fo);
    tl.style.transform=`translateY(${(1-pi)*500+fo*80+k*70}px) rotateX(${52*k}deg) rotateZ(${-30*k}deg) scale(${rs*(1-.12*fo)*(1-.08*k)*(.85+.15*pi)})`;
    // blueprint drawing
    T.draw.forEach((d,i)=>{const p=eIO(P(t,d,T.dd));const l=$('bl'+i);l.setAttribute('stroke-dashoffset',1-p);l.setAttribute('stroke',p>0&&p<1?'#C8FF2E':'#9D8BFF');l.setAttribute('stroke-width',p>0&&p<1?5:3.5);
      const tx=$('bt'+i);tx.setAttribute('opacity',eOC(P(t,d+T.dd-.1,.3))*(t<T.land[i]?1:0))});
    $('dim').setAttribute('opacity',eOC(P(t,T.draw[1]+T.dd,.3)));$('dimt').setAttribute('opacity',eOC(P(t,T.draw[1]+T.dd,.3)));
    $('cdiv').setAttribute('opacity',eOC(P(t,T.draw[2]+T.dd,.3))*(t<T.land[2]?1:0));$('hdiv').setAttribute('opacity',eOC(P(t,T.draw[1]+T.dd,.3))*(t<T.land[1]?1:0));
    // slabs
    for(let i=0;i<4;i++){const s=slabZ(i,t),e=$('sb'+i);if(!s){e.style.opacity=0;continue}e.style.opacity=s.o;
      let tr=`translateZ(${s.z}px)`;if(i==2){const c=crk(t);tr+=` translate(${c[1]}px,${c[2]}px) rotateZ(${c[0]}deg)`}e.style.transform=tr}
    // lime wave paints the site
    const wv=eIO(P(t,T.wave0,T.wave1-T.wave0)),wx=lerp(-160,1240,wv);
    const pc=t>=T.wave0?clamp((wx-SX)/426)*100:0;$('sitew').style.clipPath=`inset(0 ${100-pc}% 0 0)`;$('sitew').style.transform='translateZ(3px)';
    const wa=t>=T.wave0&&t<T.wave1+.2;$('wvb').style.opacity=wa?1-P(t,T.wave1,.2):0;$('wvl').style.opacity=wa?1-P(t,T.wave1,.2):0;
    $('wvb').style.transform=`translateX(${wx-170}px)`;$('wvl').style.transform=`translateX(${wx-6}px)`;
    // sofa squash
    let ss=1;for(const b of T.boing){const q=P(t,b,.3);if(q>0&&q<1)ss-=.12*Math.sin(Math.PI*q)*(1-q*.5)}
    {const q=P(t,T.sofa,.25);if(q>0&&q<1)ss-=.08*Math.sin(Math.PI*q)}
    $('bigSofa').style.transform=`scale(${2-ss},${ss})`;
    const cd=$('cd0');const on=t>=T.chip;cd.style.borderColor=on?'#3F6B4F':'#E7DED3';cd.style.borderWidth=on?'4px':'2px';
    {const q=t>=T.chip&&t<T.chip+.25?Math.sin(Math.PI*P(t,T.chip,.25)):0;cd.style.transform=`scale(${1-.06*q})`}
    const bt=$('BTN');{const on=t>=T.btn;bt.style.background=on?'#3F6B4F':'#3B2A1E';bt.textContent=on?'Səbətdə ✓':'Səbətə at';
      const q=t>=T.btn&&t<T.btn+.25?Math.sin(Math.PI*P(t,T.btn,.25)):0;bt.style.transform=`scale(${1-.06*q})`}
    const ts=$('toast');pop(ts,t,T.toast,{d:.45,y:30,s:.7});if(t>T.outro0-.1)ts.style.opacity=(+ts.style.opacity)*(1-P(t,T.outro0-.1,.3));
    T.lab.forEach((c,i)=>{const e=$('lab'+i);pop(e,t,c,{d:.45,x:i==1?60:-60,y:0,s:.7});if(t>T.outro0-.1)e.style.opacity=(+e.style.opacity)*(1-P(t,T.outro0-.1,.3))});
    const c=curState(t);
    const bx=$('bx');if(t>=T.ex&&t<T.st[0]){pop(bx,t,T.ex,{d:.35,y:30,s:.5});bx.style.left=(c.x-20)+'px';bx.style.top=(c.y-170)+'px';if(t>T.st[0]-.2)bx.style.opacity=(+bx.style.opacity)*(1-P(t,T.st[0]-.2,.2))}else bx.style.opacity=0;
    let fx='';
    T.draw.forEach((d,i)=>{const e=d+T.dd;if(t>=e&&t<e+.45){const s=W(i,0);fx+=lines(s[0],s[1],6,14,20,P(t,e,.45),'#C8FF2E',4)}});
    T.st.forEach(s=>{if(t>=s&&t<s+.45)fx+=lines(STOMP[0],STOMP[1]+10,7,30,28,P(t,s,.45),'#F5F5FA',5)});
    if(t>=T.fix&&t<T.fix+.6)fx+=lines(540,SY+579,12,220,46,P(t,T.fix,.6),'#C8FF2E',6);
    if(t>=T.wave1&&t<T.wave1+.6)fx+=lines(540,1060,12,260,50,P(t,T.wave1,.6),'#C8FF2E',6);
    T.boing.forEach(b=>{if(t>=b&&t<b+.4)fx+=lines(SOFAP[0],SOFAP[1]+30,6,40,22,P(t,b,.4),'#C8FF2E',4)});
    if(t>=T.chip&&t<T.chip+.5)fx+=lines(CHP[0],CHP[1],8,26,24,P(t,T.chip,.5),'#C8FF2E',5);
    if(t>=T.btn&&t<T.btn+.5)fx+=lines(BTP[0],BTP[1],8,40,30,P(t,T.btn,.5),'#C8FF2E',5);
    $('fxg').innerHTML=fx;
    const cc=$('cc');cc.style.opacity=c.vis?1:0;
    cc.style.transform=`translate(${c.x-10}px,${c.y-10}px) rotate(${c.rot}deg) scale(${c.sx},${c.sy})`;
    const bl=(t%2.7)<.12;const ey=bl?.15:Math.min(c.eye,1);
    $('eyes').setAttribute('transform',`translate(${c.lx} ${15.5*(1-ey)}) scale(${c.eye>1?c.eye:1} ${ey*(c.eye>1?c.eye:1)})`);
  }

  if(show('s6',t,T.drop-.05,20.05)){const slam=(e,t0,s0)=>{if(t<t0){e.style.opacity=0;return}const p=P(t,t0,.38);
      e.style.opacity=eOC(clamp(p*2.5));e.style.transform=`scale(${lerp(s0,1,eOQ(p))})`;e.style.filter=`blur(${(1-eOC(p))*22}px)`};
    slam($('l6a'),T.drop,1.7);slam($('l6b'),T.t6b,1.9);
    const ls=$('l6s');ls.style.opacity=t>=T.sweep?1:0;ls.style.backgroundPosition=`${lerp(140,-40,eIO(P(t,T.sweep,.75)))}% 0`;
    $('ul6').style.transform=`scaleX(${eOC(P(t,T.sweep+.1,.5))})`;
    const s6=$('s6'),xo=eIO(P(t,T.s6_out,.35));s6.style.opacity=1-xo;s6.style.transform=`scale(${1-.12*xo})`;s6.style.filter=xo>0?`blur(${xo*14}px)`:'';
    $('l6b').style.textShadow=`0 0 ${40*Math.max(0,1-P(t,T.t6b,.6))+12}px rgba(200,255,46,.45)`}

  if(show('s7',t,T.streak2-.02,24)){const s7=$('s7');s7.style.transformOrigin='540px 900px';s7.style.transform=`scale(${1+.035*eOC(P(t,T.tile,4))})`;
    const tw=$('tile7');if(t<T.tile)tw.style.opacity=0;else{const p=P(t,T.tile,.6);let sc=.4+.6*eOB(p);const cp=P(t,T.click2,.35);if(cp>0&&cp<1)sc*=1+.07*Math.sin(cp*Math.PI);
      tw.style.opacity=eOC(clamp(p*2.5));tw.style.transform=`scale(${sc}) rotate(${(1-eOC(p))*-14}deg)`}
    $('wave7').style.strokeDashoffset=1-eOC(P(t,T.wave2_0,T.wave2_1-T.wave2_0));
    const cg=$('cur7');if(t<T.cur0)cg.setAttribute('opacity',0);else{const p=eOC(P(t,T.cur0,T.cur1-T.cur0));const dx=(1-p)*-60,dy=(1-p)*90-Math.sin(p*Math.PI)*30;let sc=1;const cp=P(t,T.click2,.2);if(cp>0&&cp<1)sc=1-.14*Math.sin(cp*Math.PI);
      cg.setAttribute('opacity',eOC(clamp((t-T.cur0)/.15)));cg.setAttribute('transform',`translate(${dx} ${dy}) translate(22 11) rotate(${(1-p)*-200}) scale(${sc}) translate(-22 -11)`)}
    const bl=(t%2.7)<.12;$('eyes7').setAttribute('transform',bl?'translate(0 22) scale(1 .12)':'');
    const tipX=390+22*300/64,tipY=520+11*300/64;const bp=P(t,T.click2,.7),ring=$('ring7');
    $('spk7').innerHTML=(t>=T.click2&&bp<1)?lines(tipX,tipY,10,60,70,bp,'#C8FF2E',7):'';
    if(t<T.click2||bp>=1)ring.setAttribute('opacity',0);else{ring.setAttribute('cx',tipX);ring.setAttribute('cy',tipY);ring.setAttribute('r',30+190*eOC(bp));ring.setAttribute('opacity',(1-bp)*.9)}
    [...$('wm7').children].forEach((e,i)=>pop(e,t,T.wm+i*.06,{y:60,s:.7,d:.5,b:8}));
    pop($('cta1'),t,T.cta1,{y:40,d:.55,b:8});pop($('cta2'),t,T.cta2,{y:50,s:.8,d:.6,b:8});pop($('pill'),t,T.pill,{y:50,s:.7,d:.6});
    let shp=P(t,T.pill+.45,.7);if(t>T.pill+1.6)shp=P(t,T.pill+1.6,.7);$('shine').style.transform=`skewX(-20deg) translateX(${lerp(0,900,eIO(shp))}px)`}

}
window.render=render;render(0);
window.measure=()=>[...document.querySelectorAll('.ln,#l6b,#l6a,#toast,.lab')].map(e=>[e.id||e.textContent.slice(0,14),Math.round(e.getBoundingClientRect().width),Math.round(e.getBoundingClientRect().left)]);
</script>
