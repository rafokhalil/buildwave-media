<script>
{{HELPERS}}
const SX=327,SY=652;
const D=(x,y,w,h,c,r=0,ex='')=>`<div style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${c};border-radius:${typeof r=='number'?r+'px':r};${ex}"></div>`;
function SHIRT(x,y,sc,fill,str,cl=''){return `<svg style="position:absolute;left:${x}px;top:${y}px;overflow:visible" width="${170*sc}" height="${150*sc}" viewBox="0 0 170 150"><path d="M85 30 L85 20 Q85 10 94 10 Q102 12 100 20" fill="none" stroke="${str}" stroke-width="5" stroke-linecap="round"/><path d="M85 30 L22 60 L148 60 Z" fill="none" stroke="${str}" stroke-width="5" stroke-linejoin="round"/><path d="M42 58 L66 52 Q85 68 104 52 L128 58 L158 86 L140 104 L128 94 L128 148 L42 148 L42 94 L30 104 L12 86 Z" fill="${fill}" stroke="${str}" stroke-width="5" stroke-linejoin="round"/>${cl?`<path d="M66 52 L85 74 L104 52" fill="none" stroke="${str}" stroke-width="4"/><line x1="85" y1="74" x2="85" y2="146" stroke="${str}" stroke-width="3"/><circle cx="85" cy="92" r="3.5" fill="${str}"/><circle cx="85" cy="114" r="3.5" fill="${str}"/><circle cx="85" cy="134" r="3.5" fill="${str}"/>`:''}</svg>`}
const IMG1=D(0,0,166,116,'#EEF4FF')+SHIRT(43,8,.6,'#fff','#1E2A55',1);
const IMG2=D(0,0,166,116,'#FFF4E6')+SHIRT(43,8,.6,'#B07A45','#5A3A1E',1);
function CUP(){return SHIRT(232,116,1,'#fff','#1E2A55',1)}
function SITE(){return `<div class="stt">18:00</div><div class="url">agkoynek.az</div><div class="brand"><span class="logo"></span>Ağ Köynək</div><div class="menu"></div>
<div class="hero"><div class="ht">Paltarın<br>təzə kimi</div><div class="hs">Evdən götürürük</div><div class="tag">Təmizləmə</div>${CUP()}</div>
<div class="card" id="cd0" style="left:16px"><div class="im">${IMG1}</div><div class="nm">Köynək</div><div class="pr">4 ₼</div></div>
<div class="card" style="left:220px"><div class="im">${IMG2}</div><div class="nm">Palto</div><div class="pr">12 ₼</div></div>
<div class="chips"><div class="chp">Hamısı</div><div class="chp">Paltar</div><div class="chp">Xalça</div><div class="chp">Pərdə</div></div>
<div class="btn" id="BTN">Sifariş et</div>`}
$('site').innerHTML=SITE();
const SK=[[24,100,250,46],[16,166,394,270],[16,764,394,66],[16,464,190,230],[220,464,190,230],[16,706,394,44],[22,42,382,40]];
const ICO='<svg width="40" height="34" viewBox="0 0 40 34"><rect x="2" y="2" width="36" height="30" rx="6" fill="none" stroke="#A9A9C2" stroke-width="3"/><path d="M6 28 L16 16 L23 23 L28 18 L35 28" fill="none" stroke="#A9A9C2" stroke-width="3" stroke-linejoin="round"/><circle cx="28" cy="10" r="3" fill="#A9A9C2"/></svg>';
const LBL=['Logo',ICO+'Şəkil','Düymə',ICO+'4 ₼','Palto','Kateqoriya','agkoynek.az'];
const ORD=[0,6,1,3,4,5,2];
$('skel').innerHTML=SK.map(([x,y,w,h],k)=>`<i style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"></i>`).join('')+SK.map(([x,y,w,h],k)=>`<b style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">${LBL[k]}</b>`).join('');
const FT=k=>T.fill[ORD.indexOf(k)];
// ---------------- washing machine ----------------
const DC=[540,1130],FN=['Logo','Şəkil','Qiymət','Düymə'],CW=176,CH=64,ORB=128;
const BT=[820,722],SOCKP=[[640,1230],[700,1290],[760,1350]];
const FLYSK=[0,1,3,2],FLYT=()=>[T.fill[0],T.fill[2],T.fill[3],T.fill[6]];
const PILL=6.25,CD=[3.0,3.4,3.8],IGN=4.2;
const SPD=[[0,45],[2.9,150],[T.jam,0],[5.7,760],[6.28,0]];
function ang(t){let a=0;for(let i=0;i<SPD.length;i++){const [t0,v]=SPD[i];const t1=i+1<SPD.length?SPD[i+1][0]:1e9;if(t<=t0)break;a+=v*(Math.min(t,t1)-t0)}return a+(t>=T.jam&&t<5.7?Math.sin(t*55)*3:0)}
function chipPos(k,t){const a=(ang(t)+k*90+45)*Math.PI/180;return [DC[0]+Math.cos(a)*ORB,DC[1]+Math.sin(a)*ORB*.92,Math.sin(a*2+k)*12]}
function stateOf(k,t){if(t>=T.f4)return 'lime';if(k<3&&t>=CD[k])return t>=T.jam?'pink':'clean';return 'dirty'}
function chipSvg(k,x,y,sc,o,on,w=130){const h=w>150?66:48;return `<g opacity="${o}" transform="translate(${x} ${y}) scale(${sc})"><rect x="${-w/2}" y="${-h/2+8}" width="${w}" height="${h}" rx="16" fill="rgba(0,0,0,.45)"/><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="16" fill="${on?'#C8FF2E':'#1E1E2B'}" stroke="${on?'#07070C':'#3A3A4F'}" stroke-width="4"/>
  <text y="10" text-anchor="middle" style="font-family:'Inter Display'" font-weight="800" font-size="${w>150?30:25}" fill="${on?'#07070C':'#A9A9C2'}">${FN[k]}</text></g>`}
function drumChip(k,t){const [x,y,r]=chipPos(k,t);const st=stateOf(k,t);
  const C={dirty:['#2B2B3A','#3A3A4F','#7E7E96'],clean:['#F5F5FA','#07070C','#07070C'],pink:['#FF8FB1','#B83A62','#5A1530'],lime:['#C8FF2E','#07070C','#07070C']}[st];
  let pc=1;const w=st=='lime'?T.f4:(st=='dirty'?-9:CD[k]);if(t>=w&&t<w+.3)pc=1+.25*Math.sin(Math.PI*P(t,w,.3));
  let s=`<g transform="translate(${x} ${y}) rotate(${r}) scale(${pc})"><rect x="${-CW/2}" y="${-CH/2+7}" width="${CW}" height="${CH}" rx="16" fill="rgba(0,0,0,.4)"/><rect x="${-CW/2}" y="${-CH/2}" width="${CW}" height="${CH}" rx="16" fill="${C[0]}" stroke="${C[1]}" stroke-width="4"/>
  <text y="11" text-anchor="middle" font-family="Inter Display" font-weight="800" font-size="31" fill="${C[2]}">${FN[k]}</text>`;
  if(st=='dirty')s+=[[-60,-14,9],[48,10,11],[-20,16,6],[70,-18,5],[10,-20,7]].map(([a,b,rr])=>`<circle cx="${a}" cy="${b}" r="${rr}" fill="#6B4A2E" opacity=".85"/>`).join('');
  return s+'</g>'}
function sockSvg(x,y,r,sc){return `<g transform="translate(${x} ${y}) rotate(${r}) scale(${sc})"><path d="M-22 -60 L22 -60 L22 10 Q22 26 40 30 L62 36 Q80 42 74 60 Q68 74 48 70 L-6 58 Q-22 54 -22 36 Z" fill="#FF3B4E" stroke="#07070C" stroke-width="5" stroke-linejoin="round"/><rect x="-24" y="-66" width="48" height="20" rx="6" fill="#FFF" stroke="#07070C" stroke-width="5"/><path d="M-22 -20 L22 -20 M-22 0 L22 0" stroke="#B0182A" stroke-width="5"/></g>`}
function sockState(t){if(t<T.jam-.15||t>T.st[2]+.7)return null;
  if(t<T.st[0]){const a=(ang(t)+20)*Math.PI/180;const q=eOB(P(t,T.jam-.15,.3));return [DC[0]+Math.cos(a)*60,DC[1]+60+Math.sin(a)*30,Math.sin(t*9)*20,q]}
  let i=T.st.filter(w=>t>=w).length-1;
  if(t<T.st[2]){const q=eOB(P(t,T.st[i],.2));const a=SOCKP[i],b=SOCKP[Math.min(2,i+1)];const x=lerp(a[0],b[0],q*.25),y=lerp(a[1],b[1],q*.25);return [x,y,-30+Math.sin(t*30)*4,1]}
  const q=P(t,T.st[2],.7);return [lerp(760,1180,eIC(q)),lerp(1350,820,q)-Math.sin(Math.PI*q)*260,-30+q*540,1]}
function levelSvg(t){const [cx,cy]=DC;
  let s=`<rect x="198" y="666" width="700" height="900" rx="56" fill="rgba(0,0,0,.45)"/>
  <rect x="190" y="650" width="700" height="900" rx="56" fill="#1E1E2B" stroke="#3A3A4F" stroke-width="6"/><line x1="190" y1="790" x2="890" y2="790" stroke="#3A3A4F" stroke-width="5"/>
  <rect x="250" y="1550" width="80" height="26" rx="8" fill="#12121B"/><rect x="750" y="1550" width="80" height="26" rx="8" fill="#12121B"/>`;
  // drum shake when spinning fast
  const fast=t>=5.7&&t<6.3;const sh=fast?Math.sin(t*90)*5:(t>=2.9&&t<T.jam?Math.sin(t*40)*1.5:0);
  s+=`<g transform="translate(${sh} 0)"><circle cx="${cx}" cy="${cy}" r="300" fill="#2B2B3A" stroke="${t>=T.f4?'#C8FF2E':'#3A3A4F'}" stroke-width="8"/><circle cx="${cx}" cy="${cy}" r="266" fill="#07070C"/>
  <clipPath id="gl"><circle cx="${cx}" cy="${cy}" r="252"/></clipPath><g clip-path="url(#gl)"><rect x="${cx-260}" y="${cy-260}" width="520" height="520" fill="#0E1626"/>`;
  // drum holes rotating
  const A=ang(t);s+=`<g transform="rotate(${A} ${cx} ${cy})">`+[...Array(16)].map((_,k)=>{const a=k*Math.PI/8;return `<circle cx="${cx+Math.cos(a)*226}" cy="${cy+Math.sin(a)*226}" r="7" fill="#1E2A40"/>`}).join('')+[0,1,2].map(k=>`<rect x="${cx-12}" y="${cy-250}" width="24" height="44" rx="8" fill="#24324D" transform="rotate(${k*120} ${cx} ${cy})"/>`).join('')+'</g>';
  // water
  const wcol=t>=T.f4?'rgba(200,255,46,.26)':(t>=T.jam&&t<T.st[2]+.4?'rgba(255,90,130,.3)':(t>=2.9?'rgba(110,170,255,.28)':'rgba(140,120,90,.3)'));
  const lvl=cy+40-(t>=2.9?30:0)-(fast?60:0);let wp=`M${cx-260} ${cy+270} L${cx-260} ${lvl}`;for(let x=-260;x<=260;x+=20)wp+=` L${cx+x} ${lvl+Math.sin(x/38+t*(fast?16:5))*(fast?18:9)}`;wp+=` L${cx+260} ${cy+270} Z`;
  s+=`<path d="${wp}" fill="${wcol}"/>`;
  for(let k=0;k<4;k++)s+=drumChip(k,t);
  const so=sockState(t);if(so&&t<T.st[0])s+=sockSvg(so[0],so[1],so[2],so[3]*.9);
  // bubbles
  if(t>=2.9&&t<T.ph){for(let k=0;k<22;k++){const ph=(t*.7+k*.137)%1;const bx=cx-220+((k*97)%440)+Math.sin(t*3+k)*10,by=cy+240-ph*440;s+=`<circle cx="${bx}" cy="${by}" r="${6+(k%4)*4}" fill="none" stroke="${t>=T.f4?'#C8FF2E':'#F5F5FA'}" stroke-width="3" opacity="${.55*Math.sin(Math.PI*ph)}"/>`}}
  s+=`<path d="M${cx-170} ${cy-150} Q${cx-90} ${cy-220} ${cx} ${cy-228}" fill="none" stroke="#F5F5FA" stroke-width="10" stroke-linecap="round" opacity=".18"/></g>`;
  s+=`<rect x="${cx+282}" y="${cy-46}" width="26" height="92" rx="10" fill="#3A3A4F"/></g>`;
  // sock outside glass (being pulled)
  if(so&&t>=T.st[0])s+=sockSvg(so[0],so[1],so[2],.9);
  // panel: readout, program dial, start button
  const nc=CD.filter(w=>t>=w).length+(t>=5.7?1:0);
  s+=`<circle cx="700" cy="722" r="40" fill="#12121B" stroke="#3A3A4F" stroke-width="5"/><g transform="rotate(${-90+nc*60} 700 722)"><line x1="700" y1="722" x2="728" y2="722" stroke="${t>=T.f4?'#C8FF2E':'#F5F5FA'}" stroke-width="7" stroke-linecap="round"/></g>`;
